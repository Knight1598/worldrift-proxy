<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blacksmith Tycoon</title>
<style>
  :root {
    --ui-bg: #2a1e13;
    --ui-bg-alt: #3a2b1a;
    --panel-border: #150d06;
    --text-main: #f4e9d8;
    --text-dim: #b7a58a;
    --accent-gold: #ffd76a;
    --accent-gold-dark: #c9941f;
    --primary: #ff9f45;
    --primary-dark: #c9691a;
    --success: #7ed957;
    --danger: #ff5555;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, sans-serif;
    background: var(--ui-bg);
    color: var(--text-main);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }
  /* ตัวเลข/คะแนน ใช้ฟอนต์แนวพิกเซล-บล็อกแทน (เฉพาะจุด ไม่ใช้ทั้งหน้า เพราะฟอนต์นี้ไม่มีตัวอักษรไทย
     เบราว์เซอร์จะ fallback ไปฟอนต์ปกติสำหรับข้อความไทยอยู่ดี ใส่ไว้ให้ใช้จริงกับตัวเลข/หัวข้ออังกฤษ) */
  .pixel-num { font-family: 'Press Start 2P', 'Courier New', monospace; letter-spacing: -0.5px; }

  /* =====================================================================
     Game Area — โซนฉากเกม กิน flex:6 ของความสูงจอ (≈60%) ให้พื้นที่เดินไปมาเพียงพอ
     ===================================================================== */
  .game-area {
    position: relative;
    flex: 6;
    overflow: hidden;
    image-rendering: pixelated;
    background-image: url('assets/blacksmith/tile_wood_wall.png'), url('assets/blacksmith/tile_stone_floor.png');
    background-repeat: repeat-x, repeat-x;
    background-position: top left, bottom left;
    background-size: auto 55%, auto 55%;
  }
  .stand-tint-overlay {
    position: absolute;
    inset: 0;
    z-index: 1;
    mix-blend-mode: soft-light;
    opacity: 0.85;
    pointer-events: none;
    transition: background 0.6s ease;
  }

  /* HUD ลอยทับด้านบนของฉาก ไม่กินพื้นที่ความสูง (ไม่ลด flex ของ Game Area) */
  .hud-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 6px 8px;
    background: linear-gradient(180deg, rgba(15,10,5,0.82), rgba(15,10,5,0));
  }
  .hud-title {
    font-size: 0.72rem;
    font-weight: bold;
    color: var(--accent-gold);
    text-shadow: 2px 2px 0 #000;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .gold-counter {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: rgba(0,0,0,0.55);
    border: 2px solid var(--accent-gold-dark);
    border-radius: 4px;
    padding: 4px 8px;
    font-size: 0.75rem;
    font-weight: bold;
    color: var(--accent-gold);
    box-shadow: 2px 2px 0 rgba(0,0,0,0.5);
    flex-shrink: 0;
  }
  .gold-counter .coin-icon { width: 18px; height: 18px; image-rendering: pixelated; }

  .btn-tertiary {
    width: 30px; height: 30px;
    border-radius: 4px;
    border: 2px solid var(--panel-border);
    background: rgba(0,0,0,0.55);
    color: var(--text-main);
    font-size: 0.9rem;
    cursor: pointer;
    box-shadow: 2px 2px 0 rgba(0,0,0,0.5);
    flex-shrink: 0;
  }
  .btn-tertiary:active { transform: translate(2px, 2px); box-shadow: none; }

  /* ===== Room layout: Station อยู่บน (หลังร้าน) / เคาน์เตอร์+คิวอยู่ล่าง (หน้าร้าน) ===== */
  .stand-booth {
    position: absolute;
    z-index: 2;
    top: 6%;
    left: 50%;
    transform: translateX(-50%);
    width: 38%;
    max-width: 150px;
    height: auto;
    image-rendering: pixelated;
    cursor: pointer;
    user-select: none;
    transition: transform 0.08s ease;
    filter: drop-shadow(0 4px 3px rgba(0,0,0,0.3));
  }
  .stand-booth:active { transform: translateX(-50%) scale(0.96); }
  .stand-booth.tap-bump { animation: tapBumpCenter 0.18s ease; }
  @keyframes tapBumpCenter {
    0%   { transform: translateX(-50%) scale(1); }
    50%  { transform: translateX(-50%) scale(1.08); }
    100% { transform: translateX(-50%) scale(1); }
  }

  /* เคาน์เตอร์รับออเดอร์ — แถบยาวขวางด้านล่างของฉาก (ไม่มี asset เคาน์เตอร์แยกให้ วาดด้วย CSS) */
  .shop-counter {
    position: absolute;
    z-index: 2;
    left: 4%;
    right: 4%;
    top: 76%;
    height: 20px;
    border-radius: 3px;
    background: linear-gradient(180deg, #c98a45, #8a5a2c);
    border: 3px solid #2c1c0c;
    box-shadow: 0 4px 0 rgba(0,0,0,0.4);
  }

  /* ===== Worker (ผู้เล่น/พนักงาน) — เดินขึ้นไปทำของที่ Station แล้วเดินลงมาส่ง/เก็บเหรียญที่เคาน์เตอร์ ===== */
  .worker-layer { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
  .worker {
    position: absolute;
    left: 0; top: 0;
    width: 34px; height: 42px;
    will-change: transform;
  }
  .worker-body { width: 100%; height: 100%; }
  .worker.moving .worker-body { animation: walkBob 0.3s ease-in-out infinite alternate; }
  .worker-body img {
    width: 100%; height: 100%; object-fit: contain;
    image-rendering: pixelated;
    filter: drop-shadow(0 3px 2px rgba(0,0,0,0.3));
  }
  .worker.facing-left .worker-body img { transform: scaleX(-1); }
  .worker.staff .worker-body img { filter: drop-shadow(0 3px 2px rgba(0,0,0,0.3)) hue-rotate(150deg) saturate(1.3); }
  .worker-craft-bar-bg {
    position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
    width: 30px; height: 5px;
    background: rgba(0,0,0,0.3); border-radius: 3px; overflow: hidden;
    opacity: 0; transition: opacity 0.15s ease;
  }
  .worker-craft-bar-bg.show { opacity: 1; }
  .worker-craft-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #ffd76a, #ff9f45); }
  @keyframes walkBob { 0% { transform: translateY(0); } 100% { transform: translateY(-3px); } }

  /* ป้ายสินค้าแตะเพื่อเลเวลอัพแยก (ตามแพทเทิร์นเกมต้นแบบที่แยก "อัปเกรดสินค้า" ออกจากลิสต์อัปเกรดทั่วไป) */
  .product-badge {
    position: absolute;
    z-index: 4;
    right: 8px;
    top: 48px;
    width: 38px; height: 38px;
    border-radius: 50%;
    border: 3px solid var(--accent-gold-dark);
    background: rgba(20,14,8,0.85);
    box-shadow: 2px 2px 0 rgba(0,0,0,0.5);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    padding: 0;
  }
  .product-badge img { width: 22px; height: 22px; object-fit: contain; image-rendering: pixelated; }
  .product-badge-level {
    position: absolute; bottom: -6px; right: -6px;
    background: var(--primary-dark); color: #fff;
    font-size: 0.6rem; font-weight: bold;
    border-radius: 999px; padding: 1px 5px;
    border: 2px solid var(--ui-bg);
    min-width: 10px; text-align: center;
  }
  .product-badge.affordable { animation: affordablePulse 1.4s ease-in-out infinite; }

  /* ป๊อปอัพเลเวลอัพสินค้า */
  .product-level-box { position: relative; padding-top: 30px; }
  .modal-close-x {
    position: absolute; top: 10px; right: 10px;
    width: 28px; height: 28px; border-radius: 50%;
    border: none; background: var(--danger); color: #fff;
    font-weight: bold; cursor: pointer; line-height: 1;
  }
  .product-level-icon { width: 56px; height: 56px; object-fit: contain; image-rendering: pixelated; margin: 4px auto 10px; display: block; }
  .product-level-stars { font-size: 1.3rem; letter-spacing: 3px; margin-bottom: 10px; color: #e0d8c5; }
  .product-level-stars .star-filled { color: var(--accent-gold-dark); }
  .product-level-progress-bg { background: #e5dcc5; border-radius: 999px; height: 14px; overflow: hidden; margin-bottom: 16px; }
  .product-level-progress-fill { background: linear-gradient(90deg, #6bbf6b, #4fa9e8); height: 100%; transition: width 0.3s ease; }
  .btn-cta-mega--maxed { background: var(--success); animation: none; }

  /* คอนเฟตตี้ตอนจบด่าน */
  .confetti-piece {
    position: fixed;
    top: -20px;
    width: 8px; height: 14px;
    z-index: 200;
    pointer-events: none;
    animation: confettiFall linear forwards;
  }
  @keyframes confettiFall {
    0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(540deg); opacity: 0.9; }
  }

  /* ===== ลูกค้า: เข้าคิวหน้าเคาน์เตอร์ / รอออเดอร์ / จ่ายเงินแล้วเดินออก ===== */
  .customer-lane {
    position: absolute;
    inset: 0;
    z-index: 3;
    pointer-events: none;
  }
  .customer {
    position: absolute;
    left: 0; top: 0;
    width: 36px;
    height: 42px;
    will-change: transform;
  }
  .customer-body { width: 100%; height: 100%; }
  .customer.moving .customer-body { animation: walkBob 0.32s ease-in-out infinite alternate; }
  .customer-img { width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; }
  .customer.facing-left .customer-img { transform: scaleX(-1); }
  .customer-bubble {
    position: absolute;
    top: -20px;
    left: 50%;
    transform: translateX(-50%);
    width: 20px; height: 20px;
    opacity: 0;
    transition: opacity 0.2s ease, top 0.2s ease;
  }
  .customer-bubble img { width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; }
  .customer-bubble.show { opacity: 1; top: -26px; }
  .customer-patience-bg {
    position: absolute; top: -9px; left: 50%; transform: translateX(-50%);
    width: 28px; height: 5px;
    background: rgba(0,0,0,0.3); border-radius: 3px; overflow: hidden;
    opacity: 0; transition: opacity 0.15s ease;
  }
  .customer-patience-bg.show { opacity: 1; }
  .customer-patience-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #6bbf6b, #ffd76a); }

  /* เหรียญที่ลูกค้าทิ้งไว้รอ worker มาเก็บ */
  .coin-drop {
    position: absolute;
    left: 0; top: 0;
    width: 18px; height: 18px;
    z-index: 4;
    pointer-events: none;
  }
  .coin-drop img {
    width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated;
    animation: coinBob 0.6s ease-in-out infinite alternate;
  }
  @keyframes coinBob { 0% { transform: translateY(0); } 100% { transform: translateY(-4px); } }

  /* ตัวเลขลอยตอนเก็บเหรียญ */
  .float-text {
    position: absolute;
    font-weight: bold;
    font-size: 0.75rem;
    pointer-events: none;
    z-index: 6;
    white-space: nowrap;
    animation: floatTextUp 1s ease forwards;
  }
  .float-text--gold { color: var(--accent-gold); text-shadow: 1px 1px 0 #000; }
  .float-text--tip { color: var(--success); text-shadow: 1px 1px 0 #000; }
  @keyframes floatTextUp {
    0%   { opacity: 0; transform: translateY(0); }
    15%  { opacity: 1; }
    100% { opacity: 0; transform: translateY(-42px); }
  }

  /* =====================================================================
     UI Area — โซนปุ่มอัปเกรด กิน flex:4 ปัดขึ้นลงได้ พื้นทึบสไตล์ 8-bit
     ===================================================================== */
  .ui-area {
    flex: 4;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-y: contain;
    background: var(--ui-bg);
    border-top: 4px solid var(--panel-border);
    padding: 8px 8px 16px;
  }

  .stage-status-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    background: var(--ui-bg-alt);
    border: 3px solid var(--panel-border);
    border-radius: 3px;
    box-shadow: 2px 2px 0 rgba(0,0,0,0.5);
    padding: 6px 8px;
    margin-bottom: 8px;
    font-size: 0.68rem;
  }
  .stage-status-text { color: var(--text-main); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stage-status-text b { color: var(--accent-gold); }
  .stage-status-sep { color: var(--text-dim); margin: 0 3px; }
  .stage-status-progress { display: flex; align-items: center; gap: 6px; flex-shrink: 0; color: var(--text-dim); }
  .stage-progress-dots { display: flex; gap: 3px; }
  .stage-progress-dot {
    width: 8px; height: 8px;
    border-radius: 1px;
    background: #5a4a34;
    border: 1px solid #000;
  }
  .stage-progress-dot.done { background: var(--success); }

  /* ===== Upgrade cards — กะทัดรัด ขอบหนา hard-shadow แบบเกม ===== */
  .upgrade-list { display: flex; flex-direction: column; gap: 6px; }
  .upgrade-card {
    background: var(--ui-bg-alt);
    border: 3px solid var(--panel-border);
    border-radius: 3px;
    padding: 6px 8px;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 3px 3px 0 rgba(0,0,0,0.5);
  }
  .upgrade-icon { font-size: 1.2rem; width: 26px; text-align: center; flex-shrink: 0; }
  .upgrade-info { flex: 1; min-width: 0; }
  .upgrade-name { font-weight: bold; font-size: 0.74rem; color: var(--text-main); }
  .upgrade-desc { font-size: 0.6rem; color: var(--text-dim); margin-top: 1px; }
  .upgrade-level { font-size: 0.6rem; color: var(--accent-gold); margin-top: 2px; font-weight: bold; }

  .buy-btn {
    border: 3px solid var(--panel-border);
    border-radius: 3px;
    padding: 6px 8px;
    font-size: 0.65rem;
    font-weight: bold;
    letter-spacing: 0.2px;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
    min-width: 64px;
    box-shadow: 3px 3px 0 rgba(0,0,0,0.5);
  }
  .buy-btn--affordable {
    background: linear-gradient(180deg, #ffe08a, var(--primary));
    color: #3a1d00;
    animation: affordablePulse 1.4s ease-in-out infinite;
  }
  .buy-btn--affordable:active { transform: translate(3px, 3px); box-shadow: none; }
  @keyframes affordablePulse {
    0%, 100% { box-shadow: 3px 3px 0 rgba(0,0,0,0.5); }
    50% { box-shadow: 3px 3px 0 rgba(0,0,0,0.5), 0 0 10px 2px rgba(255,159,69,0.6); }
  }
  .buy-btn--disabled {
    background: #4a4033;
    color: #8b8070;
    cursor: not-allowed;
  }
  .buy-btn--maxed {
    background: var(--success);
    color: #0c2c06;
    cursor: default;
  }

  .stats-footer {
    text-align: center;
    font-size: 0.62rem;
    color: var(--text-dim);
    margin-top: 10px;
  }

  /* ===== Modals (ป๊อปอัพ) ===== */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(10, 6, 3, 0.7);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 16px;
  }
  .modal-overlay.show { display: flex; }
  .modal-box {
    background: #fffaf0;
    color: #4a3728;
    border: 3px solid var(--accent-gold-dark);
    border-radius: 18px;
    padding: 24px 20px;
    max-width: 360px;
    width: 100%;
    text-align: center;
    box-shadow: 0 8px 0 rgba(0,0,0,0.35);
  }
  .modal-box h2 { margin: 0 0 10px; color: var(--primary-dark); font-size: 1.15rem; }
  .modal-box p { font-size: 0.85rem; line-height: 1.5; color: #4a3728; margin: 0 0 16px; }
  .modal-emoji-big { font-size: 3rem; margin-bottom: 8px; }

  .btn-cta-mega {
    border: none;
    border-radius: 14px;
    padding: 14px 20px;
    font-size: 1rem;
    font-weight: bold;
    color: #fff;
    background: linear-gradient(180deg, #ffd76a, var(--primary-dark));
    box-shadow: 0 5px 0 #a84f10;
    cursor: pointer;
    width: 100%;
    animation: ctaGlow 1s ease-in-out infinite;
  }
  .btn-cta-mega:active { transform: translateY(3px); box-shadow: none; }
  @keyframes ctaGlow {
    0%, 100% { filter: brightness(1); }
    50% { filter: brightness(1.15); }
  }

  .btn-secondary-modal {
    margin-top: 10px;
    border: none;
    background: transparent;
    color: #9a8a75;
    font-size: 0.78rem;
    cursor: pointer;
    text-decoration: underline;
  }

  .settings-row { display: flex; align-items: center; justify-content: space-between; margin: 10px 0; font-size: 0.85rem; }
  .settings-row button { border: 2px solid #e8d5a8; background: #fff; border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 0.8rem; }
</style>
</head>
<body>

<div class="game-area" id="standStageView">
  <div class="stand-tint-overlay" id="standTintOverlay"></div>
  <div class="shop-counter"></div>
  <div class="customer-lane" id="customerLane"></div>
  <div class="worker-layer" id="workerLayer"></div>
  <img class="stand-booth" id="standBooth" src="assets/blacksmith/station_stall.png" alt="">
  <button class="product-badge" id="productBadge" title="อัปเกรดสินค้า">
    <img id="productBadgeIcon" src="" alt="">
    <span class="product-badge-level pixel-num" id="productBadgeLevel">0</span>
  </button>

  <div class="hud-bar">
    <div class="gold-counter"><img class="coin-icon" src="assets/blacksmith/coin.png" alt="gold"><span id="goldValue" class="pixel-num">0</span></div>
    <div class="hud-title">⚒️ Blacksmith Tycoon</div>
    <button class="btn-tertiary" id="btnOpenSettings" title="ตั้งค่า">⚙️</button>
  </div>
</div>

<div class="ui-area" id="uiArea">
  <div class="stage-status-bar">
    <div class="stage-status-text"><b id="stageName">แผงขายของริมทาง</b><span class="stage-status-sep">•</span><span id="stageProduct">ขาย ของกินของใช้ทั่วไป</span></div>
    <div class="stage-status-progress">
      <span class="pixel-num"><span id="stageProgressCount">0</span>/<span id="stageProgressTotal">4</span></span>
      <div class="stage-progress-dots" id="stageProgressDots"></div>
    </div>
  </div>

  <div class="upgrade-list" id="upgradeList"></div>

  <div class="stats-footer" id="statsFooter"></div>
</div>

<div class="modal-overlay" id="productLevelModal">
  <div class="modal-box product-level-box">
    <button class="modal-close-x" id="btnCloseProductLevel">✕</button>
    <h2 id="productLevelTitle">ระดับ 0 — สินค้า</h2>
    <img class="product-level-icon" id="productLevelIcon" src="" alt="">
    <div class="product-level-stars" id="productLevelStars"></div>
    <div class="product-level-progress-bg"><div class="product-level-progress-fill" id="productLevelProgressFill"></div></div>
    <button class="btn-cta-mega" id="btnBuyProductLevel">อัปเกรด</button>
  </div>
</div>

<div class="modal-overlay" id="stageCompleteModal">
  <div class="modal-box">
    <div class="modal-emoji-big">🎉</div>
    <h2 id="stageCompleteTitle">ร้านเต็มขั้นแล้ว!</h2>
    <p id="stageCompleteText"></p>
    <button class="btn-cta-mega" id="btnAdvanceStage">ไปกันเลย!</button>
  </div>
</div>

<div class="modal-overlay" id="welcomeBackModal">
  <div class="modal-box">
    <div class="modal-emoji-big">👋</div>
    <h2>ยินดีต้อนรับกลับ!</h2>
    <p id="welcomeBackText"></p>
    <button class="btn-cta-mega" id="btnCloseWelcomeBack">รับเลย!</button>
  </div>
</div>

<div class="modal-overlay" id="settingsModal">
  <div class="modal-box">
    <h2>⚙️ ตั้งค่า</h2>
    <div class="settings-row">
      <span>เสียง</span>
      <button id="btnToggleSound">เปิดอยู่</button>
    </div>
    <div class="settings-row">
      <span>รีเซ็ตเกม</span>
      <button id="btnResetGame">รีเซ็ต</button>
    </div>
    <button class="btn-secondary-modal" id="btnCloseSettings">ปิด</button>
  </div>
</div>

<div class="modal-overlay" id="gameCompleteModal">
  <div class="modal-box">
    <div class="modal-emoji-big">👑</div>
    <h2>สร้างอาณาจักรช่างตีเหล็กสำเร็จ!</h2>
    <p>คุณอัปเกรดร้านจนสุดทางแล้วในเวอร์ชันนี้ ขอบคุณที่เล่นจนจบ — ระบบใหม่กำลังจะตามมาเร็วๆ นี้!</p>
    <button class="btn-cta-mega" id="btnCloseGameComplete">เยี่ยมไปเลย!</button>
  </div>
</div>

<script>
/* =====================================================================
   ข้อมูลเกม (Stages / Upgrades)
   ===================================================================== */
const STAGES = [
  { key: 'stall',   name: 'แผงขายของริมทาง',    product: 'ของกินของใช้ทั่วไป', stationImg: 'assets/blacksmith/station_stall.png',
    customerImgs: ['assets/blacksmith/rogue.png', 'assets/blacksmith/villager_woman.png', 'assets/blacksmith/farmer_man.png'],
    color: '#f3e3c9', baseRevenue: 5   },
  { key: 'forge',   name: 'โรงตีดาบ',           product: 'ดาบ',               stationImg: 'assets/blacksmith/station_forge.png',
    customerImgs: ['assets/blacksmith/knight.png'],
    color: '#dcdbe0', baseRevenue: 25  },
  { key: 'alchemy', name: 'ห้องเล่นแร่แปรธาตุ',  product: 'โพชั่นวิเศษ',        stationImg: 'assets/blacksmith/station_alchemy.png',
    customerImgs: ['assets/blacksmith/wizard.png'],
    color: '#e3d9f3', baseRevenue: 125 },
];
function getRandomCustomerImg() {
  const imgs = getStage().customerImgs;
  return imgs[Math.floor(Math.random() * imgs.length)];
}

// ไอคอนสินค้าที่ขาย เปลี่ยนดีไซน์ (tier) ตามระดับอัปเกรด "คุณภาพสินค้า" ที่ซื้อไปแล้ว — ให้เห็นภาพว่าซื้ออัปเกรด
// แล้วของที่ขายเปลี่ยนจริง ไม่ใช่แค่ตัวเลขขยับ (จับต้องได้ตามที่ตั้งใจออกแบบไว้)
const PRODUCT_TIERS = {
  stall:   [{ minLevel: 0, icon: 'assets/blacksmith/coin.png' }],
  forge:   [{ minLevel: 0, icon: 'assets/blacksmith/sword_bronze.png' }, { minLevel: 2, icon: 'assets/blacksmith/sword_silver.png' }, { minLevel: 4, icon: 'assets/blacksmith/sword_blue.png' }],
  alchemy: [{ minLevel: 0, icon: 'assets/blacksmith/potion_red.png' }, { minLevel: 3, icon: 'assets/blacksmith/potion_blue.png' }],
};
function getProductIcon() {
  const tiers = PRODUCT_TIERS[getStage().key];
  const level = player.upgradeLevels.portion;
  let icon = tiers[0].icon;
  tiers.forEach(t => { if (level >= t.minLevel) icon = t.icon; });
  return icon;
}

const UPGRADE_TYPES = [
  { key: 'speed',   name: 'ความเร็วในการทำงาน', icon: '⚡', desc: 'พนักงานเดินไวขึ้นและทำของเสร็จเร็วขึ้น', maxLevel: 5, baseCostMult: 8  },
  // "คุณภาพสินค้า" ไม่โชว์ในลิสต์ทั่วไป — ย้ายไปเป็นป๊อปอัพแยกที่แตะตัวสินค้าโดยตรงแทน (ตามแพทเทิร์นเกมต้นแบบ
  // ที่ผู้ใช้ส่งวิดีโอมา ซึ่งแยก "อัปเกรดร้านทั่วไป" กับ "เลเวลอัปสินค้า" ออกจากกันเป็นคนละกลไก)
  { key: 'portion', name: 'คุณภาพสินค้า',     icon: '📈', desc: 'ได้เงินต่อออเดอร์มากขึ้น (และของที่ขายอัปเกรดหน้าตาด้วย)', maxLevel: 5, baseCostMult: 10, hiddenFromList: true },
  { key: 'signage', name: 'ป้ายร้าน',         icon: '📣', desc: 'ลูกค้ามาบ่อยขึ้น และรับคิวรอได้มากขึ้น',  maxLevel: 5, baseCostMult: 12 },
  { key: 'decor',   name: 'ตกแต่งร้าน',        icon: '✨', desc: 'ลูกค้ามีโอกาสให้ทิป',     maxLevel: 5, baseCostMult: 14 },
];

const UPGRADE_COST_GROWTH = 1.6;
const PORTION_LEVEL_BONUS = 0.25;
const DECOR_LEVEL_TIP_CHANCE = 0.08;

// ผู้เล่น/พนักงานเดิน+ทำของ — ควบคุมโดยอัปเกรด "ความเร็วในการทำงาน"
const BASE_CRAFT_MS = 3200;
const MIN_CRAFT_MS = 900;
const SPEED_CRAFT_MS_REDUCTION = 460; // เต็มขั้น (เลเวล 5) พอดีแตะพื้น MIN_CRAFT_MS
const BASE_MOVE_SPEED_PX = 90;   // px/วินาที
const SPEED_MOVE_BONUS_PX = 22;  // px/วินาที ต่อเลเวล

// อัตราการเกิดลูกค้า + ความจุคิว — ควบคุมโดยอัปเกรด "ป้ายร้าน"
const BASE_SPAWN_INTERVAL_MS = 3400;
const MIN_SPAWN_INTERVAL_MS = 1100;
const SIGNAGE_SPAWN_MS_REDUCTION = 460; // เต็มขั้นพอดีแตะพื้น MIN_SPAWN_INTERVAL_MS
const BASE_MAX_QUEUE = 3;
const SIGNAGE_QUEUE_BONUS = 1;

const CUSTOMER_WALK_SPEED_PX = 70; // ความเร็วเดินของลูกค้า คงที่ ไม่ผูกกับอัปเกรด (สเปกระบุให้อัปเกรดความเร็วมีผลแค่ผู้เล่น/พนักงาน)
const PATIENCE_DURATION_MS = 9000; // หลอดความอดทนเชิงภาพล้วนๆ ไม่มีผลลงโทษถ้าหมด (ไม่ได้ระบุ fail-state ไว้ในสเปก)
const APPROX_ORDER_TRAVEL_PX = 320; // ระยะทางเดินโดยประมาณต่อ 1 ออเดอร์ (ไป station + ไปส่งที่คิว + ไปเก็บเหรียญ) ใช้คำนวณ throughput แบบไม่พึ่ง DOM เพื่อให้ deterministic

const OFFLINE_MAX_HOURS = 8;
const OFFLINE_EFFICIENCY = 0.5; // รายได้ตอนไม่อยู่หน้าจอ = ครึ่งหนึ่งของอัตราปกติ (มาตรฐานเกม idle ทั่วไป)

const SAVE_KEY = 'blacksmithTycoonSave_v1';

/* =====================================================================
   Player State
   ===================================================================== */
let player = {
  gold: 0,
  stageIndex: 0,
  upgradeLevels: { speed: 0, portion: 0, signage: 0, decor: 0 },
  staffHired: false,
  lastSeenAt: Date.now(),
  settings: { soundEnabled: true },
  stats: { totalCustomersServed: 0, totalGoldEarned: 0 },
};

let audioCtx = null;

/* =====================================================================
   Formulas
   ===================================================================== */
function getStage() { return STAGES[player.stageIndex]; }
function getUpgradeType(key) { return UPGRADE_TYPES.find(u => u.key === key); }

function getUpgradeCost(key) {
  const type = getUpgradeType(key);
  const level = player.upgradeLevels[key];
  return Math.ceil(getStage().baseRevenue * type.baseCostMult * Math.pow(UPGRADE_COST_GROWTH, level));
}

function getRevenuePerSale() {
  return getStage().baseRevenue * (1 + PORTION_LEVEL_BONUS * player.upgradeLevels.portion);
}

function getCraftDurationMs() {
  return Math.max(MIN_CRAFT_MS, BASE_CRAFT_MS - player.upgradeLevels.speed * SPEED_CRAFT_MS_REDUCTION);
}

function getMoveSpeedPxPerSec() {
  return BASE_MOVE_SPEED_PX + player.upgradeLevels.speed * SPEED_MOVE_BONUS_PX;
}

function getSpawnIntervalMs() {
  return Math.max(MIN_SPAWN_INTERVAL_MS, BASE_SPAWN_INTERVAL_MS - player.upgradeLevels.signage * SIGNAGE_SPAWN_MS_REDUCTION);
}

function getMaxQueueSize() {
  return BASE_MAX_QUEUE + player.upgradeLevels.signage * SIGNAGE_QUEUE_BONUS;
}

function getTipChance() {
  return player.upgradeLevels.decor * DECOR_LEVEL_TIP_CHANCE;
}

function isStageMaxed() {
  return UPGRADE_TYPES.every(u => player.upgradeLevels[u.key] >= u.maxLevel);
}

function getStageProgressCount() {
  return UPGRADE_TYPES.filter(u => player.upgradeLevels[u.key] >= u.maxLevel).length;
}

function getWorkerCount() { return player.staffHired ? 2 : 1; }

// เวลาเฉลี่ยที่ worker คนหนึ่งใช้ต่อ 1 ออเดอร์ (คราฟท์ + เดินไปมา) — ไม่พึ่งขนาดจอจริงเพื่อให้คำนวณ Offline Earnings ได้แน่นอน
function getOrderCycleMs() {
  return getCraftDurationMs() + (APPROX_ORDER_TRAVEL_PX / getMoveSpeedPxPerSec()) * 1000;
}

// อัตราออเดอร์/มิลลิวินาที ถูก bound ด้วยตัวที่ช้ากว่าระหว่าง "ลูกค้ามาไหว" กับ "worker ทำไหว"
function getThroughputPerMs() {
  const workerThroughputPerMs = getWorkerCount() / getOrderCycleMs();
  const spawnThroughputPerMs = 1 / getSpawnIntervalMs();
  return Math.min(workerThroughputPerMs, spawnThroughputPerMs);
}

/* =====================================================================
   Sound (Web Audio API, self-contained — ไม่โหลดไฟล์เสียงภายนอก)
   ===================================================================== */
function ensureAudioCtx() {
  if (!audioCtx) {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (Ctx) audioCtx = new Ctx();
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function playTone(freq, duration, type, volume, startDelay) {
  if (!player.settings.soundEnabled) return;
  const ctx = ensureAudioCtx();
  if (!ctx) return;
  const t0 = ctx.currentTime + (startDelay || 0);
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(freq, t0);
  gain.gain.setValueAtTime(volume || 0.1, t0);
  gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
  osc.connect(gain).connect(ctx.destination);
  osc.start(t0);
  osc.stop(t0 + duration);
}
function playSfxCashRegister() { playTone(1200, 0.05, 'square', 0.08); playTone(1600, 0.06, 'square', 0.06, 0.04); }
function playSfxUpgrade() { [523, 659, 784].forEach((f, i) => playTone(f, 0.1, 'triangle', 0.09, i * 0.05)); }
function playSfxStageComplete() { [523, 659, 784, 1047, 1319].forEach((f, i) => playTone(f, 0.16, 'triangle', 0.11, i * 0.09)); }
function playSfxTap() { playTone(700, 0.03, 'square', 0.05); }

/* =====================================================================
   Scene zones — Station อยู่บน (หลังร้าน) / เคาน์เตอร์+คิวอยู่ล่าง (หน้าร้าน) ตามผัง Eatventure
   คำนวณจากขนาดจริงของ .game-area เพื่อรองรับ resize/responsive
   ===================================================================== */
const scene = { width: 300, height: 400 };
const ZONES = { stationXPct: 0.5, stationYPct: 0.30, counterYPct: 0.80, idleYPct: 0.60 };

function updateSceneMetrics() {
  const view = document.getElementById('standStageView');
  if (!view) return;
  scene.width = view.clientWidth || scene.width;
  scene.height = view.clientHeight || scene.height;
}
function stationPos(workerIndex) {
  return { x: scene.width * ZONES.stationXPct + (workerIndex || 0) * 26 - 13, y: scene.height * ZONES.stationYPct };
}
function counterLineY() {
  return scene.height * ZONES.counterYPct;
}
function idlePos(workerIndex) {
  return { x: scene.width * 0.5 + (workerIndex || 0) * 20 - 10, y: scene.height * ZONES.idleYPct };
}
function queueSlotPos(slotIndex) {
  const y = counterLineY();
  const maxSlots = Math.max(1, getMaxQueueSize());
  const usableWidth = Math.max(60, scene.width - 40);
  const spacing = Math.min(44, usableWidth / maxSlots);
  const startX = scene.width - 26;
  const x = Math.max(18, startX - slotIndex * spacing);
  return { x, y };
}

function moveToward(entity, target, speedPxPerSec, dt) {
  const dx = target.x - entity.x;
  const dy = target.y - entity.y;
  const dist = Math.hypot(dx, dy);
  const step = speedPxPerSec * (dt / 1000);
  if (dist <= step || dist < 0.5) {
    entity.x = target.x;
    entity.y = target.y;
    return true;
  }
  entity.x += (dx / dist) * step;
  entity.y += (dy / dist) * step;
  if (Math.abs(dx) > 0.5) entity.facing = dx < 0 ? -1 : 1;
  return false;
}

/* =====================================================================
   Worker (ผู้เล่น + พนักงาน) — State Machine: IDLE -> WALK_TO_STATION -> CRAFTING -> DELIVER -> COLLECT -> IDLE
   ===================================================================== */
let workers = [];
let nextEntityId = 1;

function addWorker(kind) {
  const idx = workers.length;
  const el = document.createElement('div');
  el.className = 'worker' + (kind === 'staff' ? ' staff' : '');
  el.innerHTML =
    '<div class="worker-craft-bar-bg"><div class="worker-craft-bar-fill"></div></div>' +
    '<div class="worker-body"><img src="assets/blacksmith/blacksmith.png" alt=""></div>';
  document.getElementById('workerLayer').appendChild(el);
  const pos = idlePos(idx);
  const w = {
    id: kind + '_' + idx, kind, el, workerIndex: idx,
    x: pos.x, y: pos.y, facing: 1,
    state: 'IDLE', orderId: null, pendingCoinId: null, craftElapsed: 0,
  };
  workers.push(w);
  renderWorkerTransform(w, false);
}

function initWorkers() {
  document.getElementById('workerLayer').innerHTML = '';
  workers = [];
  addWorker('player');
  if (player.staffHired) addWorker('staff');
}

function renderWorkerTransform(w, moving) {
  w.el.style.transform = `translate(${w.x}px, ${w.y}px)`;
  w.el.classList.toggle('facing-left', w.facing === -1);
  w.el.classList.toggle('moving', !!moving);
}
function showCraftBar(w) { w.el.querySelector('.worker-craft-bar-bg').classList.add('show'); }
function hideCraftBar(w) { w.el.querySelector('.worker-craft-bar-bg').classList.remove('show'); }
function updateCraftBar(w, pct) { w.el.querySelector('.worker-craft-bar-fill').style.width = (pct * 100) + '%'; }

/* =====================================================================
   Customer — เดินเข้าคิว / รอออเดอร์ / รับของ+จ่ายเงิน / เดินออก
   ===================================================================== */
let customers = [];
let coins = [];

function getQueueCustomers() {
  return customers.filter(c => c.state !== 'PAID_LEAVING').sort((a, b) => a.slotIndex - b.slotIndex);
}
function reindexQueue() {
  getQueueCustomers().forEach((c, i) => { c.slotIndex = i; });
}
function getCustomerById(id) { return customers.find(c => c.id === id); }
function getCoinById(id) { return coins.find(c => c.id === id); }

function spawnCustomerEntity() {
  const slotIndex = getQueueCustomers().length;
  const id = 'cust' + (nextEntityId++);
  const el = document.createElement('div');
  el.className = 'customer';
  el.innerHTML =
    '<div class="customer-patience-bg"><div class="customer-patience-fill"></div></div>' +
    '<div class="customer-bubble"><img alt=""></div>' +
    '<div class="customer-body"><img class="customer-img" alt=""></div>';
  el.querySelector('.customer-img').src = getRandomCustomerImg();
  document.getElementById('customerLane').appendChild(el);
  const cust = {
    id, el, slotIndex, state: 'QUEUED', facing: -1,
    x: scene.width + 24, y: counterLineY(),
    orderIcon: null, orderRevenue: 0, orderTip: 0, patienceStartAt: 0,
  };
  customers.push(cust);
  renderCustomerTransform(cust, true);
  return cust;
}

function renderCustomerTransform(cust, moving) {
  cust.el.style.transform = `translate(${cust.x}px, ${cust.y}px)`;
  cust.el.classList.toggle('facing-left', cust.facing === -1);
  cust.el.classList.toggle('moving', !!moving);
}
function showOrderBubble(cust) {
  const bubble = cust.el.querySelector('.customer-bubble');
  bubble.querySelector('img').src = cust.orderIcon;
  bubble.classList.add('show');
  cust.el.querySelector('.customer-patience-bg').classList.add('show');
}
function hideOrderBubble(cust) {
  cust.el.querySelector('.customer-bubble').classList.remove('show');
  cust.el.querySelector('.customer-patience-bg').classList.remove('show');
}
function updatePatienceBar(cust) {
  const elapsed = performance.now() - cust.patienceStartAt;
  const pct = Math.max(0, 1 - elapsed / PATIENCE_DURATION_MS);
  const fill = cust.el.querySelector('.customer-patience-fill');
  if (fill) fill.style.width = (pct * 100) + '%';
}
function removeCustomerEl(cust) {
  cust.el.remove();
  cust.state = 'REMOVED';
}

function spawnCoin(x, y, value, tip) {
  const id = 'coin' + (nextEntityId++);
  const el = document.createElement('div');
  el.className = 'coin-drop';
  el.innerHTML = '<img src="assets/blacksmith/coin.png" alt="">';
  el.style.transform = `translate(${x}px, ${y}px)`;
  document.getElementById('customerLane').appendChild(el);
  const coin = { id, x, y, value, tip, el };
  coins.push(coin);
  return coin;
}
function spawnFloatText(x, y, text, variant) {
  const el = document.createElement('div');
  el.className = 'float-text float-text--' + variant;
  el.textContent = text;
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  document.getElementById('customerLane').appendChild(el);
  setTimeout(() => el.remove(), 1000);
}

function deliverOrder(cust, worker) {
  hideOrderBubble(cust);
  cust.state = 'PAID_LEAVING';
  reindexQueue();
  const coin = spawnCoin(cust.x, cust.y - 6, cust.orderRevenue, cust.orderTip);
  worker.pendingCoinId = coin.id;
}

function collectCoin(coin, worker) {
  const total = coin.value + coin.tip;
  player.gold += total;
  player.stats.totalGoldEarned += total;
  player.stats.totalCustomersServed += 1;
  playSfxCashRegister();
  spawnFloatText(
    coin.x, coin.y,
    coin.tip > 0 ? `+${Math.round(coin.value)} (+${coin.tip} ทิป!)` : `+${Math.round(coin.value)}`,
    coin.tip > 0 ? 'tip' : 'gold'
  );
  coin.el.remove();
  coins = coins.filter(c => c.id !== coin.id);
  renderGold();
  renderUpgradeList();
  renderProductBadge();
  if (document.getElementById('productLevelModal').classList.contains('show')) renderProductLevelModal();
}

function clearAllCustomers() {
  customers.forEach(c => c.el.remove());
  customers = [];
  coins.forEach(c => c.el.remove());
  coins = [];
}

/* =====================================================================
   Game loop — worker/customer state machines อัปเดตทุกเฟรมผ่าน requestAnimationFrame
   ===================================================================== */
function findAssignableCustomer() {
  const activeSlots = workers.length; // จำนวนออเดอร์ที่รับพร้อมกันได้ = จำนวน worker (มีพนักงานช่วยแบ่งงานคิวจริง)
  const queue = getQueueCustomers();
  for (const c of queue) {
    if (c.slotIndex >= activeSlots) break;
    if (c.state === 'QUEUED') return c;
  }
  return null;
}

function tickWorkers(dt) {
  const speed = getMoveSpeedPxPerSec();
  workers.forEach(w => {
    if (w.state === 'IDLE') {
      const cust = findAssignableCustomer();
      if (cust) {
        cust.state = 'ORDER_ACTIVE';
        cust.orderIcon = getProductIcon();
        cust.orderRevenue = getRevenuePerSale();
        cust.orderTip = Math.random() < getTipChance() ? Math.round(cust.orderRevenue * (0.5 + Math.random())) : 0;
        cust.patienceStartAt = performance.now();
        showOrderBubble(cust);
        w.orderId = cust.id;
        w.state = 'WALK_TO_STATION';
        return;
      }
      const arrived = moveToward(w, idlePos(w.workerIndex), speed, dt);
      renderWorkerTransform(w, !arrived);
      return;
    }
    if (w.state === 'WALK_TO_STATION') {
      const arrived = moveToward(w, stationPos(w.workerIndex), speed, dt);
      renderWorkerTransform(w, !arrived);
      if (arrived) {
        w.state = 'CRAFTING';
        w.craftElapsed = 0;
        showCraftBar(w);
      }
      return;
    }
    if (w.state === 'CRAFTING') {
      w.craftElapsed += dt;
      const dur = getCraftDurationMs();
      updateCraftBar(w, Math.min(1, w.craftElapsed / dur));
      if (w.craftElapsed >= dur) {
        hideCraftBar(w);
        w.state = 'DELIVER';
      }
      return;
    }
    if (w.state === 'DELIVER') {
      const cust = getCustomerById(w.orderId);
      if (!cust) { w.state = 'IDLE'; w.orderId = null; return; }
      const arrived = moveToward(w, queueSlotPos(cust.slotIndex), speed, dt);
      renderWorkerTransform(w, !arrived);
      if (arrived) {
        deliverOrder(cust, w);
        w.state = 'COLLECT';
      }
      return;
    }
    if (w.state === 'COLLECT') {
      const coin = getCoinById(w.pendingCoinId);
      if (!coin) { w.state = 'IDLE'; w.orderId = null; w.pendingCoinId = null; return; }
      const arrived = moveToward(w, { x: coin.x, y: coin.y }, speed, dt);
      renderWorkerTransform(w, !arrived);
      if (arrived) {
        collectCoin(coin, w);
        w.state = 'IDLE';
        w.orderId = null;
        w.pendingCoinId = null;
      }
      return;
    }
  });
}

function tickCustomers(dt) {
  customers.forEach(cust => {
    if (cust.state === 'PAID_LEAVING') {
      const target = { x: scene.width + 24, y: cust.y };
      const arrived = moveToward(cust, target, CUSTOMER_WALK_SPEED_PX * 1.3, dt);
      renderCustomerTransform(cust, !arrived);
      if (arrived) removeCustomerEl(cust);
      return;
    }
    const target = queueSlotPos(cust.slotIndex);
    const arrived = moveToward(cust, target, CUSTOMER_WALK_SPEED_PX, dt);
    renderCustomerTransform(cust, !arrived);
    if (cust.state === 'ORDER_ACTIVE') updatePatienceBar(cust);
  });
  customers = customers.filter(c => c.state !== 'REMOVED');
}

let rafId = null;
let lastTickTime = null;
function gameTick(ts) {
  if (lastTickTime == null) lastTickTime = ts;
  let dt = ts - lastTickTime;
  lastTickTime = ts;
  dt = Math.min(dt, 100); // กันดีเลย์กระโดดยาวตอนสลับแท็บ/lag spike
  tickWorkers(dt);
  tickCustomers(dt);
  rafId = requestAnimationFrame(gameTick);
}

let spawnTimerId = null;
function scheduleNextCustomer() {
  if (spawnTimerId) clearTimeout(spawnTimerId);
  spawnTimerId = setTimeout(() => {
    if (getQueueCustomers().length < getMaxQueueSize()) spawnCustomerEntity();
    scheduleNextCustomer();
  }, getSpawnIntervalMs());
}

/* =====================================================================
   Upgrades / Stage progression
   ===================================================================== */
function buyUpgrade(key) {
  const type = getUpgradeType(key);
  const level = player.upgradeLevels[key];
  if (level >= type.maxLevel) return;
  const cost = getUpgradeCost(key);
  if (player.gold < cost) return;
  player.gold -= cost;
  player.upgradeLevels[key] += 1;
  playSfxUpgrade();
  renderGold();
  renderUpgradeList();
  renderStageProgress();
  renderProductBadge();
  if (document.getElementById('productLevelModal').classList.contains('show')) renderProductLevelModal();
  saveGame();
  if (isStageMaxed()) showStageCompleteModal();
}

function showStageCompleteModal() {
  const stage = getStage();
  const isLast = player.stageIndex >= STAGES.length - 1;
  document.getElementById('stageCompleteTitle').textContent = `${stage.name} เต็มขั้นแล้ว!`;
  if (isLast) {
    document.getElementById('stageCompleteText').textContent = 'คุณอัปเกรดร้านสุดท้ายจนเต็มขั้นแล้ว! กดเพื่อรับรางวัลปิดท้าย';
    document.getElementById('btnAdvanceStage').textContent = 'รับรางวัล!';
  } else {
    const next = STAGES[player.stageIndex + 1];
    document.getElementById('stageCompleteText').textContent = `พร้อมขยับไปเปิด "${next.name}" ขาย${next.product}แล้ว! Gold ที่มีอยู่ไม่หายไปไหน เอาไปต่อยอดร้านใหม่ได้เลย`;
    document.getElementById('btnAdvanceStage').textContent = `ไปกันเลย! (${next.name})`;
  }
  playSfxStageComplete();
  document.getElementById('stageCompleteModal').classList.add('show');
  spawnConfetti();
}

const CONFETTI_COLORS = ['#ff9f45', '#6bbf6b', '#5aa9e6', '#e35d5d', '#ffd76a', '#c77dff'];
function spawnConfetti(count) {
  const n = count || 40;
  for (let i = 0; i < n; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random() * 100 + 'vw';
    piece.style.background = CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];
    piece.style.animationDuration = (1.6 + Math.random() * 1.2) + 's';
    piece.style.animationDelay = (Math.random() * 0.4) + 's';
    document.body.appendChild(piece);
    setTimeout(() => piece.remove(), 3200);
  }
}

function advanceStage() {
  document.getElementById('stageCompleteModal').classList.remove('show');
  const wasFirstStage = player.stageIndex === 0;
  if (player.stageIndex >= STAGES.length - 1) {
    document.getElementById('gameCompleteModal').classList.add('show');
    return;
  }
  player.stageIndex += 1;
  player.upgradeLevels = { speed: 0, portion: 0, signage: 0, decor: 0 };
  if (wasFirstStage) {
    player.staffHired = true; // ปลดล็อกพนักงานคนที่สอง + รายได้ตอนไม่อยู่หน้าจอ หลังผ่านร้านแรกสำเร็จ
  }
  clearAllCustomers();
  initWorkers();
  renderAll();
  scheduleNextCustomer();
  saveGame();
}

/* =====================================================================
   Offline Earnings (ปลดล็อกหลังจ้างพนักงานร้านแรกสำเร็จ) — อิงตามรอบการผลิตจริงของ worker คูณเวลาที่ออฟไลน์
   ===================================================================== */
function applyOfflineEarnings() {
  if (!player.staffHired) return;
  const elapsedMs = Math.min(Date.now() - player.lastSeenAt, OFFLINE_MAX_HOURS * 3600 * 1000);
  if (elapsedMs < 30000) return; // น้อยกว่า 30 วินาทีไม่ต้องโชว์ ป้องกันรีเฟรชถี่ๆ แล้วเจอ modal ทุกครั้ง
  const earned = Math.floor(elapsedMs * getThroughputPerMs() * getRevenuePerSale() * OFFLINE_EFFICIENCY);
  if (earned <= 0) return;
  player.gold += earned;
  player.stats.totalGoldEarned += earned;
  const hours = (elapsedMs / 3600000).toFixed(1);
  document.getElementById('welcomeBackText').textContent = `ระหว่างที่คุณไม่อยู่ (${hours} ชม.) ร้านขายได้ Gold +${earned}!`;
  document.getElementById('welcomeBackModal').classList.add('show');
}

/* =====================================================================
   Rendering
   ===================================================================== */
function renderGold() {
  document.getElementById('goldValue').textContent = Math.floor(player.gold).toLocaleString();
}

function renderStageView() {
  const stage = getStage();
  document.getElementById('stageName').textContent = stage.name;
  document.getElementById('stageProduct').textContent = `ขาย ${stage.product}`;
  document.getElementById('standTintOverlay').style.background = stage.color;
  document.getElementById('standBooth').src = stage.stationImg;
}

function renderStageProgress() {
  const total = UPGRADE_TYPES.length;
  const done = getStageProgressCount();
  document.getElementById('stageProgressCount').textContent = done;
  document.getElementById('stageProgressTotal').textContent = total;
  const dotsEl = document.getElementById('stageProgressDots');
  dotsEl.innerHTML = '';
  UPGRADE_TYPES.forEach(u => {
    const dot = document.createElement('div');
    dot.className = 'stage-progress-dot' + (player.upgradeLevels[u.key] >= u.maxLevel ? ' done' : '');
    dotsEl.appendChild(dot);
  });
}

function renderUpgradeList() {
  const listEl = document.getElementById('upgradeList');
  listEl.innerHTML = '';
  UPGRADE_TYPES.filter(type => !type.hiddenFromList).forEach(type => {
    const level = player.upgradeLevels[type.key];
    const maxed = level >= type.maxLevel;
    const cost = maxed ? null : getUpgradeCost(type.key);
    const affordable = !maxed && player.gold >= cost;

    const card = document.createElement('div');
    card.className = 'upgrade-card';

    const icon = document.createElement('div');
    icon.className = 'upgrade-icon';
    icon.textContent = type.icon;

    const info = document.createElement('div');
    info.className = 'upgrade-info';
    const name = document.createElement('div');
    name.className = 'upgrade-name';
    name.textContent = type.name;
    const desc = document.createElement('div');
    desc.className = 'upgrade-desc';
    desc.textContent = type.desc;
    const lvl = document.createElement('div');
    lvl.className = 'upgrade-level';
    lvl.textContent = `ระดับ ${level}/${type.maxLevel}`;
    info.append(name, desc, lvl);

    const btn = document.createElement('button');
    btn.className = 'buy-btn ' + (maxed ? 'buy-btn--maxed' : affordable ? 'buy-btn--affordable' : 'buy-btn--disabled');
    btn.textContent = maxed ? 'เต็มขั้น ✓' : `ซื้อ (${cost.toLocaleString()})`;
    btn.disabled = maxed || !affordable;
    btn.addEventListener('click', () => buyUpgrade(type.key));

    card.append(icon, info, btn);
    listEl.appendChild(card);
  });
}

function renderStatsFooter() {
  document.getElementById('statsFooter').textContent =
    `เสิร์ฟลูกค้าไปแล้ว ${player.stats.totalCustomersServed.toLocaleString()} คน | รายได้สะสมทั้งหมด ${Math.floor(player.stats.totalGoldEarned).toLocaleString()} Gold`;
}

function renderProductBadge() {
  const type = getUpgradeType('portion');
  const level = player.upgradeLevels.portion;
  const maxed = level >= type.maxLevel;
  const cost = maxed ? null : getUpgradeCost('portion');
  const affordable = !maxed && player.gold >= cost;
  document.getElementById('productBadgeIcon').src = getProductIcon();
  document.getElementById('productBadgeLevel').textContent = level;
  document.getElementById('productBadge').classList.toggle('affordable', affordable);
}

function renderProductLevelModal() {
  const type = getUpgradeType('portion');
  const level = player.upgradeLevels.portion;
  const maxed = level >= type.maxLevel;
  const cost = maxed ? null : getUpgradeCost('portion');
  const affordable = !maxed && player.gold >= cost;

  document.getElementById('productLevelTitle').textContent = `ระดับ ${level} — ${getStage().product}`;
  document.getElementById('productLevelIcon').src = getProductIcon();

  const starsEl = document.getElementById('productLevelStars');
  starsEl.innerHTML = '';
  for (let i = 0; i < type.maxLevel; i++) {
    const star = document.createElement('span');
    star.textContent = '★';
    star.className = i < level ? 'star-filled' : '';
    starsEl.appendChild(star);
  }
  document.getElementById('productLevelProgressFill').style.width = `${(level / type.maxLevel) * 100}%`;

  const btn = document.getElementById('btnBuyProductLevel');
  btn.textContent = maxed ? 'เต็มขั้นแล้ว ✓' : `อัปเกรด (${cost.toLocaleString()})`;
  btn.disabled = maxed || !affordable;
  btn.className = 'btn-cta-mega' + (maxed ? ' btn-cta-mega--maxed' : '');
}

function openProductLevelModal() {
  renderProductLevelModal();
  document.getElementById('productLevelModal').classList.add('show');
}
function closeProductLevelModal() {
  document.getElementById('productLevelModal').classList.remove('show');
}

function renderAll() {
  renderGold();
  renderStageView();
  renderStageProgress();
  renderUpgradeList();
  renderProductBadge();
  renderStatsFooter();
}

/* =====================================================================
   Save / Load — คงโครงสร้างเดิมทุกฟิลด์ (SAVE_KEY เดิม) ตัว worker/customer เป็น transient state ไม่ persist
   ===================================================================== */
function saveGame() {
  const data = {
    gold: player.gold,
    stageIndex: player.stageIndex,
    upgradeLevels: player.upgradeLevels,
    staffHired: player.staffHired,
    lastSeenAt: Date.now(),
    settings: player.settings,
    stats: player.stats,
  };
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(data)); } catch (e) { /* localStorage อาจไม่พร้อมใช้งาน */ }
}

function loadGame() {
  let raw;
  try { raw = localStorage.getItem(SAVE_KEY); } catch (e) { return; }
  if (!raw) return;
  try {
    const data = JSON.parse(raw);
    Object.assign(player, {
      gold: data.gold || 0,
      stageIndex: data.stageIndex || 0,
      upgradeLevels: Object.assign({ speed: 0, portion: 0, signage: 0, decor: 0 }, data.upgradeLevels || {}),
      staffHired: data.staffHired || false,
      lastSeenAt: data.lastSeenAt || Date.now(),
      settings: Object.assign({ soundEnabled: true }, data.settings || {}),
      stats: Object.assign({ totalCustomersServed: 0, totalGoldEarned: 0 }, data.stats || {}),
    });
  } catch (e) { /* เซฟเสีย ใช้ค่าเริ่มต้นแทน */ }
}

/* =====================================================================
   Event listeners
   ===================================================================== */
document.getElementById('standBooth').addEventListener('click', (e) => {
  e.currentTarget.classList.remove('tap-bump');
  void e.currentTarget.offsetWidth;
  e.currentTarget.classList.add('tap-bump');
  playSfxTap();
});

document.getElementById('productBadge').addEventListener('click', () => openProductLevelModal());
document.getElementById('btnCloseProductLevel').addEventListener('click', () => closeProductLevelModal());
document.getElementById('btnBuyProductLevel').addEventListener('click', () => buyUpgrade('portion'));

document.getElementById('btnAdvanceStage').addEventListener('click', () => advanceStage());
document.getElementById('btnCloseWelcomeBack').addEventListener('click', () => {
  document.getElementById('welcomeBackModal').classList.remove('show');
  renderGold();
});
document.getElementById('btnCloseGameComplete').addEventListener('click', () => {
  document.getElementById('gameCompleteModal').classList.remove('show');
});

document.getElementById('btnOpenSettings').addEventListener('click', () => {
  document.getElementById('btnToggleSound').textContent = player.settings.soundEnabled ? 'เปิดอยู่' : 'ปิดอยู่';
  document.getElementById('settingsModal').classList.add('show');
});
document.getElementById('btnCloseSettings').addEventListener('click', () => {
  document.getElementById('settingsModal').classList.remove('show');
});
document.getElementById('btnToggleSound').addEventListener('click', () => {
  player.settings.soundEnabled = !player.settings.soundEnabled;
  document.getElementById('btnToggleSound').textContent = player.settings.soundEnabled ? 'เปิดอยู่' : 'ปิดอยู่';
  saveGame();
});
document.getElementById('btnResetGame').addEventListener('click', () => {
  if (!confirm('ยืนยันรีเซ็ตเกม? ความคืบหน้าทั้งหมดจะหายไป')) return;
  try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
  location.reload();
});

/* =====================================================================
   Autosave + Init
   ===================================================================== */
setInterval(saveGame, 10000);
window.addEventListener('beforeunload', saveGame);
window.addEventListener('resize', updateSceneMetrics);

loadGame();
updateSceneMetrics();
applyOfflineEarnings();
renderAll();
initWorkers();
scheduleNextCustomer();
rafId = requestAnimationFrame(gameTick);
</script>
</body>
</html>
