<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Treasure Idle RPG</title>

<!--
=====================================================================
 ASSET MANIFEST / รายการไฟล์ภาพที่ต้องเตรียม
 ---------------------------------------------------------------
 วางไฟล์ภาพทั้งหมดตามโครงสร้างโฟลเดอร์นี้ (สัมพัทธ์กับไฟล์ html นี้):

 games/
   treasure-idle-rpg.html   <- ไฟล์นี้
   assets/
     monsters/   slime.png, bat.png, rat.png, skeleton.png, goblin.png,
                 orc.png, dark_wolf.png, spider.png, dark_knight.png,
                 stone_golem.png, red_demon.png, necromancer.png,
                 purple_dragon.png, armored_golem_warrior.png, demon_king.png
     equipment/  sword_bronze.png, sword_iron.png, sword_silver_gem.png,
                 sword_gold_gem.png, shield_wood.png, shoulder_leather.png,
                 shield_steel.png, shoulder_steel.png, shield_holy_blue.png,
                 ring.png, necklace.png
     chests/     chest_common_closed.png / _open.png
                 chest_good_closed.png / _open.png
                 chest_rare_closed.png / _open.png
                 chest_epic_closed.png / _open.png
                 chest_legendary_closed.png / _open.png
     ui/         panel_wood.png, panel_stone.png, panel_gold.png,
                 bar_hp_bg.png, bar_hp_fill_red.png,
                 button_gold.png, button_red.png, button_gray.png,
                 button_blue.png, button_green.png,
                 slot_frame_brown.png, slot_frame_gray.png, slot_frame_gold.png,
                 icon_gold_coin.png
     bg/         forest.png, cave.png, desert.png, snow.png, graveyard.png,
                 volcano.png, castle.png, hell.png, heaven.png,
                 demon_king_throne.png

 สถานะปัจจุบัน: ไฟล์ภาพทั้งหมดถูกตัดจาก sprite sheet และวางไว้ใน games/assets/
 ตามโครงสร้างนี้เรียบร้อยแล้ว — ถ้าต้องการเปลี่ยนรูปภาพใดก็แค่แทนที่ไฟล์เดิม
 (ชื่อไฟล์/โฟลเดอร์ต้องตรงกับที่ระบุไว้ด้านบน) โค้ดจะยังเล่นได้ปกติแม้ไฟล์ภาพ
 ไฟล์ใดไฟล์หนึ่งหายไป (จะเห็นกรอบ/พื้นที่ว่างแทนรูปที่ขาด)
=====================================================================
-->

<style>
  :root {
    --panel-radius: 6px;
    --gap: 12px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: #10121c;
    color: #f1ecd8;
    /* เดิมใช้ 'Courier New' เป็นฟอนต์หลัก แต่ฟอนต์นี้ไม่มีตัวอักษรไทย
       เบราว์เซอร์เลยต้องสลับไปใช้ฟอนต์อื่นเฉพาะข้อความไทย ทำให้อังกฤษ/ไทย
       ในหน้าเดียวกันดูคนละสไตล์ปนกัน — เปลี่ยนมาใช้ฟอนต์ที่ครอบคลุมทั้งไทย
       และอังกฤษในตัวเดียวเป็นฟอนต์หลักแทน เพื่อให้ทั้งหน้าดูเป็นฟอนต์เดียวกัน */
    font-family: 'Tahoma', 'Leelawadee UI', 'Noto Sans Thai', 'Loma', sans-serif;
    font-size: 15px;
  }

  /* rendering ทุก sprite/รูปให้คมชัดแบบ pixel art ไม่เบลอตอนขยาย */
  img, .sprite, .bg-scene, .panel, .btn, .item-slot, .hp-bar-bg, .hp-bar-fill {
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
  }

  /* =====================================================================
     ระบบภาพเคลื่อนไหว (Animation system): ตัวเลขดาเมจลอย, เขย่า/แฟลชตอนโดนตี,
     หีบสั่นก่อนเปิด, ป้ายชนะ/แพ้, เรืองแสงไอเทม Legendary, พื้นหลังเฟดตอนเปลี่ยนด่าน
     ===================================================================== */
  @keyframes floatUp {
    0%   { transform: translate(-50%, 0); opacity: 1; }
    100% { transform: translate(-50%, -46px); opacity: 0; }
  }
  .dmg-popup {
    position: absolute;
    left: 50%;
    top: 32%;
    transform: translate(-50%, 0);
    font-weight: bold;
    font-size: 1.05rem;
    color: #fff;
    text-shadow: 2px 2px 0 #000, 0 0 4px #000;
    pointer-events: none;
    white-space: nowrap;
    animation: floatUp 0.9s ease-out forwards;
    z-index: 5;
  }
  .dmg-popup--crit  { color: #ffd76a; font-size: 1.5rem; }
  .dmg-popup--dodge { color: #7ad1ff; font-style: italic; font-size: 0.9rem; }

  @keyframes hitShake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }
  @keyframes hitFlash {
    0% { filter: brightness(1); }
    30% { filter: brightness(2.2) saturate(0.3); }
    100% { filter: brightness(1); }
  }
  .hit-shake { animation: hitShake 0.35s ease-in-out; }
  .hit-flash { animation: hitFlash 0.35s ease-in-out; }

  @keyframes chestShake {
    0%, 100% { transform: rotate(0deg); }
    20% { transform: rotate(-7deg); }
    40% { transform: rotate(7deg); }
    60% { transform: rotate(-5deg); }
    80% { transform: rotate(5deg); }
  }
  @keyframes chestPop {
    0%   { transform: scale(1); }
    50%  { transform: scale(1.28); }
    100% { transform: scale(1); }
  }
  .chest-shake { animation: chestShake 0.5s ease-in-out; }
  .chest-pop   { animation: chestPop 0.4s ease-out; }

  @keyframes bannerPop {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
    20%  { opacity: 1; transform: translate(-50%, -50%) scale(1.12); }
    35%  { transform: translate(-50%, -50%) scale(1); }
    75%  { opacity: 1; }
    100% { opacity: 0; }
  }
  .battle-banner {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    font-size: 1.6rem;
    font-weight: bold;
    text-shadow: 2px 2px 0 #000, 0 0 8px #000;
    opacity: 0;
    pointer-events: none;
    z-index: 6;
  }
  .battle-banner.show { animation: bannerPop 1.1s ease-out forwards; }
  .battle-banner--victory { color: #6be36b; }
  .battle-banner--defeat  { color: #ff6b6b; }

  @keyframes legendaryGlow {
    0%, 100% { box-shadow: 0 0 4px 2px rgba(255, 204, 51, 0.5); }
    50%      { box-shadow: 0 0 11px 5px rgba(255, 204, 51, 0.95); }
  }
  .item-slot--legendary,
  .inventory-item--legendary {
    animation: legendaryGlow 1.6s ease-in-out infinite;
  }

  h1.title {
    text-align: center;
    margin: 10px 0;
    font-size: 1.4rem;
    letter-spacing: 2px;
    color: #ffd76a;
    text-shadow: 2px 2px 0 #000;
  }

  .game-wrap {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 var(--gap) 20px;
  }

  .board {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    grid-template-areas: "char chest battle";
    gap: var(--gap);
  }

  @media (max-width: 768px) {
    .board {
      grid-template-columns: 1fr;
      grid-template-areas: "char" "chest" "battle";
    }
  }

  /* ===============================================
     🖼️ ใส่รูปภาพตรงนี้ (พื้นหลังกรอบพาเนลแต่ละใบ)
     วางไฟล์ในโฟลเดอร์ assets/ui/
     =============================================== */
  .panel {
    border-radius: var(--panel-radius);
    padding: 14px;
    background-color: #2a2140;
    background-repeat: no-repeat;
    background-size: 100% 100%;
    border: 4px solid #000;
    box-shadow: inset 0 0 0 2px #4a3a70;
    min-height: 260px;
  }
  .panel--character {
    grid-area: char;
    /* ใส่รูปภาพตรงนี้: กรอบไม้ */
    background-image: url('assets/ui/panel_wood.png');
  }
  .panel--chest {
    grid-area: chest;
    /* ใส่รูปภาพตรงนี้: กรอบหิน */
    background-image: url('assets/ui/panel_stone.png');
  }
  .panel--battle {
    grid-area: battle;
    /* ใส่รูปภาพตรงนี้: กรอบทอง */
    background-image: url('assets/ui/panel_gold.png');
  }

  .panel h2 {
    margin: 0 0 10px;
    font-size: 1rem;
    color: #ffd76a;
    border-bottom: 2px dashed #5a4a80;
    padding-bottom: 6px;
  }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin: 6px 0;
    font-size: 0.85rem;
  }

  .gold-display {
    text-align: center;
    font-size: 1rem;
    color: #ffd76a;
    margin-bottom: 10px;
  }
  .gold-display img { width: 18px; height: 18px; vertical-align: middle; margin-right: 4px; }

  /* ===============================================
     🖼️ ใส่รูปภาพตรงนี้ (แถบเลือด HP)
     วางไฟล์ในโฟลเดอร์ assets/ui/
     =============================================== */
  .hp-bar-bg {
    position: relative;
    width: 100%;
    height: 18px;
    background-color: #3a0a0a;
    background-image: url('assets/ui/bar_hp_bg.png');
    background-size: 100% 100%;
    border-radius: 3px;
    overflow: hidden;
    border: 2px solid #000;
  }
  .hp-bar-fill {
    height: 100%;
    background-color: #d3372c;
    background-image: url('assets/ui/bar_hp_fill_red.png');
    background-size: 100% 100%;
    transition: width 0.3s ease;
  }
  .hp-bar-label {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.7rem;
    text-shadow: 1px 1px 0 #000;
  }

  .stat-line { display: flex; justify-content: space-between; font-size: 0.85rem; margin: 3px 0; }

  /* ===============================================
     🖼️ ใส่รูปภาพตรงนี้ (พื้นหลังปุ่มแต่ละสี)
     วางไฟล์ในโฟลเดอร์ assets/ui/
     =============================================== */
  .btn {
    display: inline-block;
    width: 100%;
    padding: 8px 6px;
    margin-top: 6px;
    border: 2px solid #000;
    border-radius: 4px;
    color: #fff;
    text-shadow: 1px 1px 0 #000;
    font-family: inherit;
    font-size: 0.8rem;
    cursor: pointer;
    background-color: #555;
    background-repeat: no-repeat;
    background-size: 100% 100%;
    transition: filter 0.12s ease, transform 0.12s ease;
  }
  .btn:hover:not(:disabled) { filter: brightness(1.18); transform: translateY(-1px); }
  .btn:active:not(:disabled) { transform: translateY(1px); filter: brightness(0.92); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn--primary { background-color: #b8860b; background-image: url('assets/ui/button_gold.png'); }
  .btn--danger  { background-color: #a33; background-image: url('assets/ui/button_red.png'); }
  .btn--neutral { background-color: #666; background-image: url('assets/ui/button_gray.png'); }
  .btn--info    { background-color: #2f6fb0; background-image: url('assets/ui/button_blue.png'); }
  .btn--success { background-color: #2f8f4e; background-image: url('assets/ui/button_green.png'); }

  .upgrade-row { display: grid; grid-template-columns: 1fr auto; gap: 6px; align-items: center; }

  /* ===============================================
     🖼️ ใส่รูปภาพตรงนี้ (กรอบช่องไอเทม/อุปกรณ์)
     วางไฟล์ในโฟลเดอร์ assets/ui/
     =============================================== */
  .equip-slots { display: flex; gap: 8px; margin-top: 10px; }
  .item-slot {
    width: 54px;
    height: 54px;
    background-color: #3a2a1a;
    background-image: url('assets/ui/slot_frame_brown.png'); /* ค่าเริ่มต้นก่อนสวมใส่ไอเทม */
    background-repeat: no-repeat;
    background-size: 100% 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .item-slot--common,
  .item-slot--good { background-image: url('assets/ui/slot_frame_brown.png'); }
  .item-slot--rare,
  .item-slot--epic { background-image: url('assets/ui/slot_frame_gray.png'); }
  .item-slot--legendary { background-image: url('assets/ui/slot_frame_gold.png'); }
  .item-slot img { width: 70%; height: 70%; object-fit: contain; }
  .item-slot .slot-label {
    position: absolute;
    bottom: -16px;
    left: 0; right: 0;
    text-align: center;
    font-size: 0.55rem;
    color: #cfc7ae;
  }

  /* กล่องสมบัติ */
  .chest-count { text-align: center; font-size: 0.9rem; margin-bottom: 8px; }
  .chest-open-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  /* ===============================================
     🖼️ ใส่รูปภาพตรงนี้ (ภาพกล่องสมบัติ ปิด/เปิด ตามระดับความหายาก)
     วางไฟล์ในโฟลเดอร์ assets/chests/
     =============================================== */
  .chest-sprite {
    width: 96px;
    height: 96px;
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
  }
  .gacha-result {
    width: 100%;
    background: #1c1730;
    border: 2px dashed #6a5a9a;
    border-radius: 4px;
    padding: 8px;
    text-align: center;
    font-size: 0.8rem;
  }
  .gacha-result img { width: 40px; height: 40px; object-fit: contain; margin-bottom: 4px; }
  .rarity-common    { color: #b7b7b7; }
  .rarity-good      { color: #5cd65c; }
  .rarity-rare      { color: #57a0ff; }
  .rarity-epic      { color: #c46bff; }
  .rarity-legendary { color: #ffcc33; }

  .gacha-actions { display: flex; gap: 6px; margin-top: 6px; }
  .gacha-actions .btn { margin-top: 0; }

  /* คลังไอเทม (Inventory) */
  .inventory-section { margin-top: 12px; }
  .inventory-title { font-size: 0.85rem; color: #ffd76a; margin: 8px 0 4px; }
  .inventory-list { max-height: 160px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
  .inventory-item {
    display: flex;
    align-items: center;
    gap: 6px;
    background: #1c1730;
    border: 1px solid #4a3a70;
    border-radius: 4px;
    padding: 4px 6px;
    font-size: 0.7rem;
  }
  .inventory-item img { width: 26px; height: 26px; object-fit: contain; flex-shrink: 0; }
  .inventory-item .inv-name { flex: 1; }
  .inventory-item .btn { width: auto; padding: 3px 8px; margin-top: 0; font-size: 0.62rem; }
  .inventory-empty { text-align: center; font-size: 0.72rem; color: #8a84a0; padding: 10px 0; }

  /* Prestige */
  .prestige-section { margin-top: 16px; border-top: 2px dashed #5a4a80; padding-top: 10px; }

  /* ฉากต่อสู้ */
  /* ===============================================
     🖼️ ใส่รูปภาพตรงนี้ (พื้นหลังฉากต่อสู้ เปลี่ยนตามช่วงด่าน)
     วางไฟล์ในโฟลเดอร์ assets/bg/
     =============================================== */
  .bg-scene {
    width: 100%;
    height: 130px;
    background-color: #1a2a1a;
    background-size: cover;
    background-position: center;
    border-radius: 4px;
    border: 2px solid #000;
    margin-bottom: 10px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.18s ease;
  }
  .bg-scene.bg-fading { opacity: 0.15; } /* เฟดวูบตอนเปลี่ยนพื้นหลังข้ามช่วงด่าน */
  .bg-scene .monster-sprite {
    width: 72px;
    height: 72px;
    object-fit: contain;
    filter: drop-shadow(2px 2px 0 #000);
  }
  .stage-badge {
    position: absolute;
    top: 4px;
    left: 6px;
    font-size: 0.7rem;
    background: rgba(0,0,0,0.6);
    padding: 2px 6px;
    border-radius: 3px;
  }
  .tier-badge {
    position: absolute;
    top: 4px;
    right: 6px;
    font-size: 0.65rem;
    padding: 2px 6px;
    border-radius: 3px;
  }
  .tier-normal   { background: rgba(80,80,80,0.7); }
  .tier-midboss  { background: rgba(180,120,20,0.8); }
  .tier-bigboss  { background: rgba(180,20,20,0.85); }

  .monster-name { text-align: center; font-size: 0.85rem; margin-bottom: 4px; }

  .battle-buttons { display: flex; gap: 6px; }

  /* Battle log */
  .log-panel {
    grid-column: 1 / -1;
    margin-top: var(--gap);
    background: #0c0d15;
    border: 3px solid #000;
    border-radius: var(--panel-radius);
    padding: 10px;
    height: 150px;
    overflow-y: auto;
    font-size: 0.78rem;
    line-height: 1.5;
  }
  .log-panel div { border-bottom: 1px solid #222; padding: 2px 0; }
  .log-panel div:last-child { color: #ffd76a; }
</style>
</head>
<body>

<h1 class="title">⚔ Treasure Idle RPG ⚔</h1>

<div class="game-wrap">
  <div class="board">

    <!-- ============ Panel 1: Character ============ -->
    <section class="panel panel--character">
      <h2>ตัวละคร</h2>
      <div class="gold-display">
        <img src="assets/ui/icon_gold_coin.png" alt="gold" onerror="this.style.display='none'">
        <span id="goldValue">0</span> Gold
      </div>

      <div class="row"><span>Lv.</span><span id="playerLevel">1</span></div>

      <div class="hp-bar-bg" id="playerHpBarBg">
        <div class="hp-bar-fill" id="hpBarFill" style="width:100%;"></div>
        <div class="hp-bar-label" id="hpBarLabel">50 / 50</div>
      </div>

      <div class="stat-line"><span>ATK</span><span id="statAtk">10</span></div>
      <div class="stat-line"><span>DEF</span><span id="statDef">5</span></div>
      <div class="stat-line"><span>โอกาสคริติคอล</span><span id="statCrit">10%</span></div>
      <div class="stat-line"><span>โอกาสหลบหลีก</span><span id="statDodge">5%</span></div>
      <div class="stat-line"><span>CP (พลังรบรวม)</span><span id="statCp">0</span></div>

      <div class="equip-slots">
        <div class="item-slot" id="slotWeapon"><span class="slot-label">อาวุธ</span></div>
        <div class="item-slot" id="slotArmor"><span class="slot-label">เกราะ</span></div>
        <div class="item-slot" id="slotRing"><span class="slot-label">แหวน</span></div>
      </div>

      <div style="margin-top:22px;">
        <div class="upgrade-row">
          <button class="btn btn--danger" id="btnUpgradeHp">อัปเกรด HP (<span id="costHp">-</span> Gold)</button>
        </div>
        <div class="upgrade-row">
          <button class="btn btn--danger" id="btnUpgradeAtk">อัปเกรด ATK (<span id="costAtk">-</span> Gold)</button>
        </div>
        <div class="upgrade-row">
          <button class="btn btn--danger" id="btnUpgradeDef">อัปเกรด DEF (<span id="costDef">-</span> Gold)</button>
        </div>
      </div>

      <div class="prestige-section">
        <div class="row"><span>Prestige Points</span><span id="prestigePoints">0</span></div>
        <div class="row"><span>โบนัสถาวร (ATK/DEF/HP)</span><span id="prestigeBonus">+0%</span></div>
        <button class="btn btn--success" id="btnPrestige">Prestige</button>
      </div>
    </section>

    <!-- ============ Panel 2: Chest / Gacha ============ -->
    <section class="panel panel--chest">
      <h2>กล่องสมบัติ</h2>
      <div class="chest-count">กล่องที่มี: <span id="chestCount">0</span></div>

      <div class="chest-open-area">
        <div class="chest-sprite" id="chestSprite"></div>
        <button class="btn btn--primary" id="btnOpenChest">เปิดกล่อง</button>

        <div class="gacha-result" id="gachaResult" style="display:none;">
          <img id="gachaItemIcon" src="" alt="item" onerror="this.style.display='none'">
          <div id="gachaItemName">-</div>
          <div id="gachaItemValue">-</div>
          <div class="gacha-actions">
            <button class="btn btn--info" id="btnEquipItem">สวมใส่</button>
            <button class="btn btn--neutral" id="btnKeepItem">เก็บไว้</button>
            <button class="btn btn--success" id="btnSellItem">ขายรับ Gold</button>
          </div>
        </div>

<script>
/* =====================================================================

// Asset สำรอง (มีในชีตแต่ไม่ผูกกับระบบหลัก): axe.png, spear.png, bow.png, wand.png,
// boots.png, gloves.png, helmet.png, potion_red.png, potion_blue.png

const SLOT_NAMES = { weapon: 'อาวุธ', armor: 'เกราะ', ring: 'แหวน' };

// ===============================================
// 🖼️ ใส่รูปหีบสมบัติตรงนี้ (ปิด/เปิด) ตามระดับความหายาก
// วางไฟล์ในโฟลเดอร์ assets/chests/
// (ข้ามแถวหีบปีศาจปาก/มิมิค — เป็น asset สำรอง ไม่ใช้ในสเปคนี้)

const CHEST_ICONS = {

  good:      { closed: 'assets/chests/chest_good_closed.png',      open: 'assets/chests/chest_good_open.png' },

  epic:      { closed: 'assets/chests/chest_epic_closed.png',      open: 'assets/chests/chest_epic_open.png' },
  legendary: { closed: 'assets/chests/chest_legendary_closed.png', open: 'assets/chests/chest_legendary_open.png' },
};

// ===============================================
// 🖼️ ใส่รูปกรอบพาเนล/หลอดเลือด/ปุ่ม/ช่องไอเทมตรงนี้
// วางไฟล์ในโฟลเดอร์ assets/ui/ (อ้างอิงซ้ำกับ CSS ด้านบนของไฟล์นี้)
// Asset สำรอง (มีในชีตแต่ไม่ผูก): เพชร 4 สี, ไอคอนล็อก/เกียร์/ย้อนกลับ, ลูกศร D-pad
// ===============================================
const CURRENCY_ICONS = { gold: 'assets/ui/icon_gold_coin.png' };

// ===============================================
// 🖼️ ใส่รูปพื้นหลังฉากต่อสู้ตรงนี้ (ตามช่วงด่าน)
// วางไฟล์ในโฟลเดอร์ assets/bg/
// ด่าน 100+ ใช้ฉาก "ห้องบัลลังก์ราชาปีศาจ" คู่กับบอส demon_king
// ===============================================
const BG_BY_STAGE_RANGE = [
  { min: 1,   max: 10,  bg: 'assets/bg/forest.png' },
  { min: 11,  max: 20,  bg: 'assets/bg/cave.png' },
  { min: 21,  max: 30,  bg: 'assets/bg/desert.png' },
  { min: 31,  max: 40,  bg: 'assets/bg/snow.png' },
  { min: 41,  max: 50,  bg: 'assets/bg/graveyard.png' },
  { min: 51,  max: 60,  bg: 'assets/bg/volcano.png' },
  { min: 61,  max: 70,  bg: 'assets/bg/castle.png' },
  { min: 71,  max: 80,  bg: 'assets/bg/hell.png' },
  { min: 81,  max: 99,  bg: 'assets/bg/heaven.png' },
  { min: 100, max: 999, bg: 'assets/bg/demon_king_throne.png' },
];
function getBgForStage(stage) {
  const found = BG_BY_STAGE_RANGE.find(r => stage >= r.min && stage <= r.max);
  return (found || BG_BY_STAGE_RANGE[0]).bg;
}

/* =====================================================================
   MONSTER ROSTER — stage gating (มอนสเตอร์ที่ปรากฏในแต่ละช่วงด่าน)
   ===================================================================== */
const MONSTERS = [
  { key: 'slime',        name: 'Slime',                 icon: MONSTER_ICONS.slime,        stageMin: 1,   stageMax: 10,  hp: 20,  atk: 4,  def: 1 },
  { key: 'bat',          name: 'Bat',                    icon: MONSTER_ICONS.bat,           stageMin: 3,   stageMax: 15,  hp: 22,  atk: 5,  def: 1 },
  { key: 'rat',          name: 'Giant Rat',              icon: MONSTER_ICONS.rat,           stageMin: 1,   stageMax: 12,  hp: 18,  atk: 4,  def: 0 },
  { key: 'goblin',       name: 'Goblin',                 icon: MONSTER_ICONS.goblin,        stageMin: 5,   stageMax: 20,  hp: 28,  atk: 7,  def: 2 },
  { key: 'skeleton',     name: 'Skeleton Swordsman',     icon: MONSTER_ICONS.skeleton,      stageMin: 8,   stageMax: 25,  hp: 35,  atk: 8,  def: 3 },
  { key: 'orc',          name: 'Goblin Brute',           icon: MONSTER_ICONS.orc,           stageMin: 12,  stageMax: 30,  hp: 45,  atk: 10, def: 4 },
  { key: 'dark_wolf',    name: 'Dark Wolf',              icon: MONSTER_ICONS.dark_wolf,     stageMin: 15,  stageMax: 35,  hp: 40,  atk: 12, def: 3 },
  { key: 'spider',       name: 'Spider',                 icon: MONSTER_ICONS.spider,        stageMin: 18,  stageMax: 40,  hp: 42,  atk: 11, def: 4 },
  { key: 'dark_knight',  name: 'Dark Knight',            icon: MONSTER_ICONS.dark_knight,   stageMin: 25,  stageMax: 50,  hp: 60,  atk: 15, def: 8 },
  { key: 'stone_golem',  name: 'Stone Golem',            icon: MONSTER_ICONS.stone_golem,   stageMin: 30,  stageMax: 60,  hp: 90,  atk: 14, def: 15 },
  { key: 'red_demon',    name: 'Red Demon',              icon: MONSTER_ICONS.red_demon,     stageMin: 35,  stageMax: 70,  hp: 80,  atk: 20, def: 6 },
  { key: 'necromancer',  name: 'Necromancer',            icon: MONSTER_ICONS.necromancer,   stageMin: 40,  stageMax: 80,  hp: 75,  atk: 22, def: 5 },
  { key: 'armored_golem_warrior', name: 'Armored Golem Warrior', icon: MONSTER_ICONS.armored_golem_warrior, stageMin: 50, stageMax: 999, hp: 120, atk: 25, def: 20 },
  { key: 'purple_dragon',name: 'Purple Dragon',          icon: MONSTER_ICONS.purple_dragon, stageMin: 60,  stageMax: 999, hp: 150, atk: 30, def: 12 },
  { key: 'demon_king',   name: 'Demon King',             icon: MONSTER_ICONS.demon_king,    stageMin: 100, stageMax: 999, hp: 400, atk: 45, def: 25 },
];

function getStageMonster(stage) {
  const candidates = MONSTERS.filter(m => stage >= m.stageMin && stage <= m.stageMax);
  const pool = candidates.length ? candidates : [MONSTERS[0]];
  const base = pool[Math.floor(Math.random() * pool.length)];

  const stageScale = 1 + (stage - 1) * 0.15;
  let mult = 1;
  let tier = 'normal';
  if (stage % 10 === 0)      { mult = 5; tier = 'bigboss'; }
  else if (stage % 5 === 0)  { mult = 3; tier = 'midboss'; }
  // HP ใช้ mult เต็มเพื่อความ "อึด" ของบอส แต่ ATK/DEF ใช้ sqrt(mult) แทน
  // ป้องกันไม่ให้ DEF ของบอสสูงจนหักล้าง ATK ผู้เล่นจนเหลือดาเมจ 1 แทบทุกครั้ง
  const offenseMult = Math.sqrt(mult);
  // มอนสเตอร์ระดับสูง (มิด/บิ๊กบอส) มีโอกาสคริติคอลมากขึ้น ส่วนโอกาสหลบหลีกคงที่
  const CRIT_BY_TIER = { normal: 0.05, midboss: 0.08, bigboss: 0.12 };

  return {
    key: base.key,
    name: base.name,
    icon: base.icon,
    tier,
    maxHp: Math.round(base.hp * stageScale * mult),
    hp: Math.round(base.hp * stageScale * mult),
    atk: Math.round(base.atk * stageScale * offenseMult),
    def: Math.round(base.def * stageScale * offenseMult),
    crit: CRIT_BY_TIER[tier],
    dodge: 0.05,
  };
}

/* =====================================================================
   RARITY / GACHA SYSTEM
   ===================================================================== */
const RARITY_TABLE = [
  { key: 'common',    weight: 50, mult: 1.0, label: 'Common' },
  { key: 'good',      weight: 30, mult: 1.5, label: 'Good' },
  { key: 'rare',      weight: 15, mult: 2.2, label: 'Rare' },
  { key: 'epic',      weight: 4,  mult: 3.5, label: 'Epic' },
  { key: 'legendary', weight: 1,  mult: 5.5, label: 'Legendary' },
];

function rollRarity() {
  const total = RARITY_TABLE.reduce((s, r) => s + r.weight, 0); // 100
  let roll = Math.random() * total;
  for (const r of RARITY_TABLE) {
    if (roll < r.weight) return r;
    roll -= r.weight;
  }
  return RARITY_TABLE[0];
}

const SLOT_BASE_VALUE = { weapon: 3, armor: 2, ring: 8 };

function rollItem(slotType, stage) {
  const rarity = rollRarity();
  const base = SLOT_BASE_VALUE[slotType];
  const stageScale = 1 + (stage - 1) * 0.12;
  const value = Math.max(1, Math.round(base * rarity.mult * stageScale));
  return {
    slot: slotType,
    rarity: rarity.key,
    rarityLabel: rarity.label,
    value,
    icon: EQUIPMENT_ICONS[slotType][rarity.key],
    name: `${rarity.label} ${SLOT_NAMES[slotType]}`,
  };
}

function rollGachaItem(stage) {
  const slots = ['weapon', 'armor', 'ring'];
  const slotType = slots[Math.floor(Math.random() * slots.length)];
  return rollItem(slotType, stage);
}

function getSellValue(item) {
  return Math.floor(item.value * 4);
}

/* =====================================================================
   PLAYER STATE
   ===================================================================== */
let player = {
  gold: 100,
  stage: 1,
  highestStage: 1, // ด่านสูงสุดที่เคยไปถึง (ใช้คำนวณรางวัล Prestige แม้ว่า stage จะถูกรีเซ็ต)
  prestigePoints: 0, // แต้มถาวรจากการ Prestige ไม่ถูกรีเซ็ต
  baseStats: { hp: 50, atk: 10, def: 5 },
  upgradeLevels: { hp: 0, atk: 0, def: 0 },
  currentHp: 50,
  equipment: { weapon: null, armor: null, ring: null },
  inventory: [], // ไอเทมที่เก็บไว้แต่ยังไม่ได้สวมใส่ (คลังไอเทม)
  chests: 1, // เริ่มต้นให้ 1 กล่อง เพื่อให้ทดสอบระบบกาชาได้ทันที
  autoBattle: false,
  animating: false, // กำลังเล่นแอนิเมชันการต่อสู้ทีละยกอยู่หรือไม่
  encounter: null, // มอนสเตอร์ปัจจุบันของด่านนี้ (สุ่มครั้งเดียวต่อด่าน)
  pendingGacha: null, // ไอเทมที่เพิ่งสุ่มได้ รอ Equip/เก็บไว้/Sell
};

// ===============================================
// PRESTIGE — รีเซ็ตด่านเพื่อแลกโบนัสถาวร
// ===============================================
const PRESTIGE_STAGE_REQUIREMENT = 10; // ต้องเคยไปถึงด่านนี้อย่างน้อย ถึงจะได้ Prestige Point 1 แต้ม
function getPrestigeMultiplier(p) { return 1 + p.prestigePoints * 0.05; }
function getPrestigeGain(p) { return Math.floor((p.highestStage || 1) / PRESTIGE_STAGE_REQUIREMENT); }

function getMaxHp(p) { return Math.round((p.baseStats.hp + p.upgradeLevels.hp * 10 + (p.equipment.ring ? p.equipment.ring.value : 0)) * getPrestigeMultiplier(p)); }
function getAtk(p)   { return Math.round((p.baseStats.atk + p.upgradeLevels.atk * 2 + (p.equipment.weapon ? p.equipment.weapon.value : 0)) * getPrestigeMultiplier(p)); }
function getDef(p)   { return Math.round((p.baseStats.def + p.upgradeLevels.def * 1 + (p.equipment.armor ? p.equipment.armor.value : 0)) * getPrestigeMultiplier(p)); }
function getCP(p)    { return Math.round(getMaxHp(p) * 0.5 + getAtk(p) * 2 + getDef(p) * 1.5); }
function getPlayerLevel(p) { return 1 + p.upgradeLevels.hp + p.upgradeLevels.atk + p.upgradeLevels.def; }
function getUpgradeCost(statKey) {
  const n = player.upgradeLevels[statKey];
  return Math.floor(20 * Math.pow(1.15, n));
}

// โอกาสคริติคอล/หลบหลีกของผู้เล่น เพิ่มขึ้นเล็กน้อยตามจำนวนครั้งที่อัปเกรด ATK/DEF
function getCritChance(p) { return Math.min(0.6, 0.10 + p.upgradeLevels.atk * 0.005); }
function getDodgeChance(p) { return Math.min(0.5, 0.05 + p.upgradeLevels.def * 0.005); }

function doPrestige() {
  const gain = getPrestigeGain(player);
  if (gain <= 0) return;
  const totalPoints = player.prestigePoints + gain;
  player.autoBattle = false;
  player.gold = 100;
  player.stage = 1;
  player.highestStage = 1;
  player.baseStats = { hp: 50, atk: 10, def: 5 };
  player.upgradeLevels = { hp: 0, atk: 0, def: 0 };
  player.equipment = { weapon: null, armor: null, ring: null };
  player.inventory = [];
  player.chests = 1;
  player.encounter = null;
  player.pendingGacha = null;
  player.prestigePoints = totalPoints;
  player.currentHp = getMaxHp(player);
  appendLog([`✦ Prestige! ได้รับ Prestige Point +${gain} (สะสม ${totalPoints} แต้ม, โบนัสถาวร +${Math.round((getPrestigeMultiplier(player) - 1) * 100)}%)`]);
  ensureEncounter();
  renderAll();
}

function ensureEncounter() {
  if (!player.encounter) {
    player.encounter = getStageMonster(player.stage);
  }
}

/* =====================================================================
   SAVE / LOAD (localStorage — เก็บความคืบหน้าไว้เมื่อปิดแท็บ/รีเฟรช)
   ===================================================================== */
const SAVE_KEY = 'treasureIdleRpgSave';

function saveGame() {
  const data = {
    gold: player.gold,
    stage: player.stage,
    highestStage: player.highestStage,
    prestigePoints: player.prestigePoints,
    baseStats: player.baseStats,
    upgradeLevels: player.upgradeLevels,
    currentHp: player.currentHp,
    equipment: player.equipment,
    inventory: player.inventory,
    chests: player.chests,
  };
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(data)); } catch (e) { /* localStorage อาจไม่พร้อมใช้งาน เช่น เปิดจากไฟล์โดยตรงในบางเบราว์เซอร์ */ }
}

function loadGame() {
  let raw;
  try { raw = localStorage.getItem(SAVE_KEY); } catch (e) { return; }
  if (!raw) return;
  try {
    const data = JSON.parse(raw);
    Object.assign(player, {
      gold: data.gold, stage: data.stage,
      highestStage: data.highestStage || data.stage || 1,
      prestigePoints: data.prestigePoints || 0,
      baseStats: data.baseStats,
      upgradeLevels: data.upgradeLevels, currentHp: data.currentHp,
      equipment: data.equipment, inventory: data.inventory || [],
      chests: data.chests,
    });
  } catch (e) { /* เซฟไฟล์เสีย ข้ามไปเริ่มเกมใหม่ */ }
}

/* =====================================================================
   COMBAT — คำนวณผลทั้งหมดล่วงหน้าเป็นรายการ "เหตุการณ์" ต่อยก (turn events)
   รวมโอกาสคริติคอล/หลบหลีก แล้วค่อยเล่นทีละยกแบบมีจังหวะ (ดู playEvents)
   ===================================================================== */
const CRIT_MULT = 1.75;

function resolveBattle() {
  ensureEncounter();
  const monster = player.encounter;
  let playerHp = getMaxHp(player);
  let monsterHp = monster.hp;
  const atk = getAtk(player), def = getDef(player);
  const playerCrit = getCritChance(player), playerDodge = getDodgeChance(player);
  const events = [{ text: `เจอ ${monster.name} (ด่าน ${player.stage}, ${tierLabel(monster.tier)})`, playerHp, monsterHp }];

  let turn = 0;
  while (playerHp > 0 && monsterHp > 0 && turn < 200) {
    turn++;
    // ผู้เล่นโจมตีมอนสเตอร์ก่อน
    if (Math.random() < monster.dodge) {
      events.push({ text: `${monster.name} หลบการโจมตีของคุณ!`, playerHp, monsterHp, target: 'monster', kind: 'dodge' });
    } else {
      let dmg = Math.max(1, atk - monster.def);
      const isCrit = Math.random() < playerCrit;
      if (isCrit) dmg = Math.round(dmg * CRIT_MULT);
      monsterHp -= dmg;
      events.push({ text: `คุณโจมตี ${monster.name}${isCrit ? ' คริติคอล!' : ''} เป็นดาเมจ ${dmg}`, playerHp, monsterHp: Math.max(0, monsterHp), target: 'monster', kind: isCrit ? 'crit' : 'hit', dmg });
    }
    if (monsterHp <= 0) { events.push({ text: `${monster.name} พ่ายแพ้!`, playerHp, monsterHp: 0 }); break; }

    // แล้วมอนสเตอร์โต้กลับ
    if (Math.random() < playerDodge) {
      events.push({ text: 'คุณหลบการโจมตีสำเร็จ!', playerHp, monsterHp, target: 'player', kind: 'dodge' });
    } else {
      let dmg = Math.max(1, monster.atk - def);
      const isCrit = Math.random() < monster.crit;
      if (isCrit) dmg = Math.round(dmg * CRIT_MULT);
      playerHp -= dmg;
      events.push({ text: `${monster.name} โจมตีคุณ${isCrit ? ' คริติคอล!' : ''} เป็นดาเมจ ${dmg}`, playerHp: Math.max(0, playerHp), monsterHp, target: 'player', kind: isCrit ? 'crit' : 'hit', dmg });
    }
    if (playerHp <= 0) { events.push({ text: 'คุณพ่ายแพ้...', playerHp: 0, monsterHp }); break; }
  }

  player.currentHp = Math.max(0, playerHp);
  monster.hp = Math.max(0, monsterHp);

  return { victory: monsterHp <= 0 && playerHp > 0, monster, events };
}

function tierLabel(tier) {
  if (tier === 'midboss') return 'Mid-Boss';
  if (tier === 'bigboss') return 'Big-Boss';
  return 'ปกติ';
}

function grantChest(n) {
  player.chests += n;
}

// จบการต่อสู้: แจกรางวัล/เลื่อนด่าน (เรียกหลังแอนิเมชันเล่นจบแล้ว)
function finalizeBattle(result) {
  if (result.victory) {
    const bossMult = result.monster.tier === 'bigboss' ? 5 : result.monster.tier === 'midboss' ? 3 : 1;
    const goldDrop = Math.floor(10 * (1 + (player.stage - 1) * 0.2) * bossMult);
    player.gold += goldDrop;
    appendLog([`ได้รับ ${goldDrop} Gold`]);

    if (result.monster.tier === 'midboss') {
      grantChest(1);
      appendLog(['ได้รับกล่องสมบัติ 1 ใบ']);
    } else if (result.monster.tier === 'bigboss') {
      grantChest(3);
      appendLog(['ได้รับกล่องสมบัติ 3 ใบ']);
    }

    player.stage += 1;
    player.highestStage = Math.max(player.highestStage || 1, player.stage);
    player.encounter = null; // สุ่มมอนสเตอร์ใหม่สำหรับด่านถัดไป
  }
  player.currentHp = getMaxHp(player); // ฟื้น HP เต็มก่อนด่านถัดไป/หลังพ่ายแพ้ (แนวเกม idle ไม่ลงโทษหนัก)
  ensureEncounter();
}

// อัปเดตแถบเลือดทั้งสองฝั่งแบบสด ระหว่างเล่นแอนิเมชันทีละยก (ไม่เรียก renderAll เต็มรูปแบบเพื่อไม่ให้กระตุก)
function renderLiveHpBars(playerHp, monsterHp, monsterMaxHp) {
  const maxHp = getMaxHp(player);
  const hpPct = Math.max(0, Math.min(100, (playerHp / maxHp) * 100));
  document.getElementById('hpBarFill').style.width = hpPct + '%';
  document.getElementById('hpBarLabel').textContent = `${Math.max(0, Math.round(playerHp))} / ${maxHp}`;

  const mPct = Math.max(0, Math.min(100, (monsterHp / monsterMaxHp) * 100));
  document.getElementById('monsterHpFill').style.width = mPct + '%';
  document.getElementById('monsterHpLabel').textContent = `${Math.max(0, monsterHp)} / ${monsterMaxHp}`;
}

// แสดงตัวเลขดาเมจลอยขึ้นเหนือ container ที่กำหนด (มอนสเตอร์ = bgScene, ผู้เล่น = แถบเลือด)
function spawnDamagePopup(container, ev) {
  if (!container) return;
  const popup = document.createElement('div');
  let cls = 'dmg-popup';
  let text;
  if (ev.kind === 'dodge') { cls += ' dmg-popup--dodge'; text = 'MISS'; }
  else { if (ev.kind === 'crit') cls += ' dmg-popup--crit'; text = `-${ev.dmg}`; }
  popup.className = cls;
  popup.textContent = text;
  container.appendChild(popup);
  popup.addEventListener('animationend', () => popup.remove());
}

// เขย่า + แฟลชสีให้เห็นชัดว่าเป้าหมายโดนตี (รีสตาร์ทแอนิเมชันได้แม้โดนตีรัวๆ ติดกัน)
function triggerHitEffect(el) {
  if (!el) return;
  el.classList.remove('hit-shake', 'hit-flash');
  void el.offsetWidth; // บังคับ reflow เพื่อให้แอนิเมชันเริ่มใหม่ได้ทุกครั้ง
  el.classList.add('hit-shake', 'hit-flash');
}

function showBattleBanner(text, kind) {
  const banner = document.getElementById('battleBanner');
  if (!banner) return;
  banner.classList.remove('show');
  void banner.offsetWidth;
  banner.textContent = text;
  banner.className = `battle-banner battle-banner--${kind} show`;
}

// เล่นเหตุการณ์ทีละยกลง Battle Log พร้อมหน่วงจังหวะ — จำกัดเวลารวมไว้ไม่ให้
// การต่อสู้ที่มีหลายสิบยก (เช่นสู้บอสตอนสเตตัสยังไม่พอ) ใช้เวลานานเกินไป
function playEvents(events, monsterMaxHp, done) {
  const totalBudgetMs = 3000;
  const perEventDelay = Math.max(60, Math.min(350, totalBudgetMs / Math.max(1, events.length)));
  let i = 0;
  function step() {
    if (i >= events.length) { done(); return; }
    const ev = events[i++];
    appendLog([ev.text]);
    renderLiveHpBars(ev.playerHp, ev.monsterHp, monsterMaxHp);
    if (ev.target === 'monster') {
      spawnDamagePopup(document.getElementById('bgScene'), ev);
      if (ev.kind !== 'dodge') triggerHitEffect(document.getElementById('monsterSprite'));
    } else if (ev.target === 'player') {
      spawnDamagePopup(document.getElementById('playerHpBarBg'), ev);
      if (ev.kind !== 'dodge') triggerHitEffect(document.getElementById('playerHpBarBg'));
    }
    setTimeout(step, perEventDelay);
  }
  step();
}

// เริ่มสู้ 1 ครั้ง: คำนวณผลทันที แต่ค่อยๆ เล่นแอนิเมชันให้ดู แล้วค่อยสรุปผลตอนจบ
function startBattle(onComplete) {
  if (player.animating) return;
  player.animating = true;
  renderAll();
  const monsterMaxHp = player.encounter.maxHp;
  const result = resolveBattle();
  playEvents(result.events, monsterMaxHp, () => {
    showBattleBanner(result.victory ? 'ชนะ!' : 'พ่ายแพ้...', result.victory ? 'victory' : 'defeat');
    finalizeBattle(result);
    player.animating = false;
    renderAll();
    if (onComplete) onComplete();
  });
}

/* =====================================================================
   AUTO-BATTLE (ลูกโซ่ setTimeout ที่ตรวจสอบ player.autoBattle ทุกครั้งก่อน
   เริ่มยกถัดไป — กันไม่ให้เกิดหลายลูปซ้อนกันแม้ผู้ใช้จะกดเปิด/ปิดรัวๆ)
   ===================================================================== */
function toggleAutoBattle() {
  player.autoBattle = !player.autoBattle;
  renderAll();
  if (player.autoBattle) runAutoBattleLoop();
}

function runAutoBattleLoop() {
  if (!player.autoBattle) return;
  startBattle(() => {
    if (player.autoBattle) setTimeout(runAutoBattleLoop, 400);
  });
}

/* =====================================================================
   RENDERING
   ===================================================================== */
function appendLog(lines) {
  const panel = document.getElementById('logPanel');
  lines.forEach(line => {
    const div = document.createElement('div');
    div.textContent = line;
    panel.appendChild(div);
  });
  // จำกัดจำนวนบรรทัด log ไม่ให้ยาวไม่มีที่สิ้นสุด
  while (panel.children.length > 300) {
    panel.removeChild(panel.firstChild);
  }
  panel.scrollTop = panel.scrollHeight;
}

function renderEquipSlot(elId, item) {
  const el = document.getElementById(elId);
  el.className = 'item-slot' + (item ? ` item-slot--${item.rarity}` : '');
  el.innerHTML = '<span class="slot-label"></span>';
  if (item) {
    const img = document.createElement('img');
    img.src = item.icon;
    img.alt = item.name;
    img.onerror = () => { img.style.display = 'none'; };
    el.insertBefore(img, el.firstChild);
  }
  const labelText = el.id === 'slotWeapon' ? 'อาวุธ' : el.id === 'slotArmor' ? 'เกราะ' : 'แหวน';
  el.querySelector('.slot-label').textContent = item ? `+${item.value}` : labelText;
}

function renderCharacterPanel() {
  document.getElementById('goldValue').textContent = Math.floor(player.gold);
  document.getElementById('playerLevel').textContent = getPlayerLevel(player);

  const maxHp = getMaxHp(player);
  const hpPct = Math.max(0, Math.min(100, (player.currentHp / maxHp) * 100));
  document.getElementById('hpBarFill').style.width = hpPct + '%';
  document.getElementById('hpBarLabel').textContent = `${Math.max(0, Math.round(player.currentHp))} / ${maxHp}`;

  document.getElementById('statAtk').textContent = getAtk(player);
  document.getElementById('statDef').textContent = getDef(player);
  document.getElementById('statCrit').textContent = `${Math.round(getCritChance(player) * 100)}%`;
  document.getElementById('statDodge').textContent = `${Math.round(getDodgeChance(player) * 100)}%`;
  document.getElementById('statCp').textContent = getCP(player);

  renderEquipSlot('slotWeapon', player.equipment.weapon);
  renderEquipSlot('slotArmor', player.equipment.armor);
  renderEquipSlot('slotRing', player.equipment.ring);

  document.getElementById('costHp').textContent = getUpgradeCost('hp');
  document.getElementById('costAtk').textContent = getUpgradeCost('atk');
  document.getElementById('costDef').textContent = getUpgradeCost('def');

  document.getElementById('btnUpgradeHp').disabled = player.gold < getUpgradeCost('hp');
  document.getElementById('btnUpgradeAtk').disabled = player.gold < getUpgradeCost('atk');
  document.getElementById('btnUpgradeDef').disabled = player.gold < getUpgradeCost('def');

  document.getElementById('prestigePoints').textContent = player.prestigePoints;
  document.getElementById('prestigeBonus').textContent = `+${Math.round((getPrestigeMultiplier(player) - 1) * 100)}%`;
  const prestigeGain = getPrestigeGain(player);
  const btnPrestige = document.getElementById('btnPrestige');
  btnPrestige.textContent = prestigeGain > 0
    ? `Prestige (+${prestigeGain} Point, รีเซ็ตด่าน)`
    : `Prestige (ต้องเคยถึงด่าน ${PRESTIGE_STAGE_REQUIREMENT}+)`;
  btnPrestige.disabled = prestigeGain <= 0;
}

function renderChestPanel() {
  document.getElementById('chestCount').textContent = player.chests;
  document.getElementById('btnOpenChest').disabled = player.chests <= 0;

  const sprite = document.getElementById('chestSprite');
  // ใช้ภาพหีบระดับ common แบบปิดเป็นค่าเริ่มต้นก่อนเปิด (ยังไม่รู้ rarity ล่วงหน้า)
  sprite.style.backgroundImage = `url('${CHEST_ICONS.common.closed}')`;

  const resultBox = document.getElementById('gachaResult');
  if (player.pendingGacha) {
    resultBox.style.display = 'block';
    const item = player.pendingGacha;
    document.getElementById('gachaItemIcon').src = item.icon;
    const nameEl = document.getElementById('gachaItemName');
    nameEl.textContent = item.name;
    nameEl.className = `rarity-${item.rarity}`;
    document.getElementById('gachaItemValue').textContent = `+${item.value} (ขายได้ ${getSellValue(item)} Gold)`;
    sprite.style.backgroundImage = `url('${CHEST_ICONS[item.rarity].open}')`;
    resultBox.className = 'gacha-result' + (item.rarity === 'legendary' ? ' inventory-item--legendary' : '');
  } else {
    resultBox.style.display = 'none';
    resultBox.className = 'gacha-result';
  }

  renderInventory();
}

function renderInventory() {
  document.getElementById('invCount').textContent = player.inventory.length;
  const list = document.getElementById('inventoryList');
  list.innerHTML = '';
  if (player.inventory.length === 0) {
    list.innerHTML = '<div class="inventory-empty">ยังไม่มีไอเทมเก็บไว้</div>';
    return;
  }
  player.inventory.forEach((item, idx) => {
    const row = document.createElement('div');
    row.className = 'inventory-item' + (item.rarity === 'legendary' ? ' inventory-item--legendary' : '');
    const img = document.createElement('img');
    img.src = item.icon;
    img.alt = item.name;
    img.onerror = () => { img.style.display = 'none'; };
    const name = document.createElement('span');
    name.className = `inv-name rarity-${item.rarity}`;
    name.textContent = `${item.name} +${item.value}`;
    const btnEquip = document.createElement('button');
    btnEquip.className = 'btn btn--info';
    btnEquip.textContent = 'สวม';
    btnEquip.dataset.action = 'equip';
    btnEquip.dataset.idx = idx;
    const btnSell = document.createElement('button');
    btnSell.className = 'btn btn--success';
    btnSell.textContent = 'ขาย';
    btnSell.dataset.action = 'sell';
    btnSell.dataset.idx = idx;
    row.append(img, name, btnEquip, btnSell);
    list.appendChild(row);
  });
}

let lastRenderedBg = null; // ใช้ตรวจว่าพื้นหลังเปลี่ยนไปจากเดิมหรือไม่ เพื่อเล่นเอฟเฟกต์เฟด

function renderBattlePanel() {
  document.getElementById('stageNum').textContent = player.stage;
  const bgScene = document.getElementById('bgScene');
  const nextBg = getBgForStage(player.stage);
  if (lastRenderedBg !== null && lastRenderedBg !== nextBg) {
    bgScene.classList.add('bg-fading');
    setTimeout(() => bgScene.classList.remove('bg-fading'), 200);
  }
  lastRenderedBg = nextBg;
  bgScene.style.backgroundImage = `url('${nextBg}')`;

  ensureEncounter();
  const monster = player.encounter;
  document.getElementById('monsterSprite').src = monster.icon;
  document.getElementById('monsterSprite').style.opacity = 1;
  document.getElementById('monsterName').textContent = monster.name;

  const tierBadge = document.getElementById('tierBadge');
  tierBadge.textContent = tierLabel(monster.tier);
  tierBadge.className = `tier-badge tier-${monster.tier}`;

  const hpPct = Math.max(0, Math.min(100, (monster.hp / monster.maxHp) * 100));
  document.getElementById('monsterHpFill').style.width = hpPct + '%';
  document.getElementById('monsterHpLabel').textContent = `${Math.max(0, monster.hp)} / ${monster.maxHp}`;

  document.getElementById('btnFight').disabled = player.autoBattle || player.animating;
  document.getElementById('btnAutoBattle').textContent = `Auto-Battle: ${player.autoBattle ? 'ON' : 'OFF'}`;
  document.getElementById('btnAutoBattle').className = `btn ${player.autoBattle ? 'btn--danger' : 'btn--primary'}`;
}

function renderAll() {
  renderCharacterPanel();
  renderChestPanel();
  renderBattlePanel();
  saveGame();
}

/* =====================================================================
   EVENT HANDLERS
   ===================================================================== */
document.getElementById('btnUpgradeHp').addEventListener('click', () => {
  const cost = getUpgradeCost('hp');
  if (player.gold < cost) return;
  player.gold -= cost;
  player.upgradeLevels.hp += 1;
  player.currentHp = getMaxHp(player);
  renderAll();
});

document.getElementById('btnUpgradeAtk').addEventListener('click', () => {
  const cost = getUpgradeCost('atk');
  if (player.gold < cost) return;
  player.gold -= cost;
  player.upgradeLevels.atk += 1;
  renderAll();
});

document.getElementById('btnUpgradeDef').addEventListener('click', () => {
  const cost = getUpgradeCost('def');
  if (player.gold < cost) return;
  player.gold -= cost;
  player.upgradeLevels.def += 1;
  renderAll();
});

let chestOpening = false; // กันกดเปิดกล่องซ้ำระหว่างเล่นแอนิเมชันสั่น-เปิด

document.getElementById('btnOpenChest').addEventListener('click', () => {
  if (player.chests <= 0 || chestOpening) return;
  chestOpening = true;
  document.getElementById('btnOpenChest').disabled = true;

  const sprite = document.getElementById('chestSprite');
  sprite.classList.remove('chest-shake', 'chest-pop');
  void sprite.offsetWidth; // บังคับ reflow ให้แอนิเมชันเริ่มใหม่ได้เสมอ
  sprite.classList.add('chest-shake');

  setTimeout(() => {
    player.chests -= 1;
    player.pendingGacha = rollGachaItem(player.stage);
    appendLog([`เปิดกล่อง: ได้รับ ${player.pendingGacha.name}`]);
    renderAll();
    const spriteAfter = document.getElementById('chestSprite');
    spriteAfter.classList.remove('chest-shake');
    spriteAfter.classList.add('chest-pop');
    chestOpening = false;
  }, 500);
});

document.getElementById('btnEquipItem').addEventListener('click', () => {
  if (!player.pendingGacha) return;
  const item = player.pendingGacha;
  const old = player.equipment[item.slot];
  player.equipment[item.slot] = item;
  if (old) player.inventory.push(old); // ของเก่าไม่หาย เก็บเข้าคลังไอเทมแทน
  player.pendingGacha = null;
  player.currentHp = Math.min(player.currentHp, getMaxHp(player));
  appendLog([`สวมใส่ ${item.name} เรียบร้อย`]);
  renderAll();
});

document.getElementById('btnKeepItem').addEventListener('click', () => {
  if (!player.pendingGacha) return;
  player.inventory.push(player.pendingGacha);
  appendLog([`เก็บ ${player.pendingGacha.name} ไว้ในคลังไอเทม`]);
  player.pendingGacha = null;
  renderAll();
});

document.getElementById('btnSellItem').addEventListener('click', () => {
  if (!player.pendingGacha) return;
  const item = player.pendingGacha;
  const value = getSellValue(item);
  player.gold += value;
  player.pendingGacha = null;
  appendLog([`ขาย ${item.name} ได้ ${value} Gold`]);
  renderAll();
});

document.getElementById('inventoryList').addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  const idx = parseInt(btn.dataset.idx, 10);
  const item = player.inventory[idx];
  if (Number.isNaN(idx) || !item) return;

  if (btn.dataset.action === 'equip') {
    const old = player.equipment[item.slot];
    player.equipment[item.slot] = item;
    player.inventory.splice(idx, 1);
    if (old) player.inventory.push(old); // สลับของเก่ากลับเข้าคลังแทนที่จะทิ้ง
    player.currentHp = Math.min(player.currentHp, getMaxHp(player));
    appendLog([`สวมใส่ ${item.name} เรียบร้อย`]);
  } else if (btn.dataset.action === 'sell') {
    const value = getSellValue(item);
    player.gold += value;
    player.inventory.splice(idx, 1);
    appendLog([`ขาย ${item.name} ได้ ${value} Gold`]);
  }
  renderAll();
});

document.getElementById('btnPrestige').addEventListener('click', () => {
  doPrestige();
});

document.getElementById('btnFight').addEventListener('click', () => {
  if (player.autoBattle || player.animating) return;
  startBattle();
});

document.getElementById('btnAutoBattle').addEventListener('click', () => {
  toggleAutoBattle();
});

/* =====================================================================
   INIT
   ===================================================================== */
loadGame();
ensureEncounter();
renderAll();
</script>
