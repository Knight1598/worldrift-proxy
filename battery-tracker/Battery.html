<!--
  หน้าติดตามสถานะการกระตุ้นแบตเตอรี่
  ก็อปไฟล์นี้ไปวางใน Apps Script เป็นไฟล์ชนิด HTML ชื่อ Battery

  หน้าเดียวใช้ได้ 2 โหมด:
    - เปิดลิงก์ธรรมดา          → สาขาดูสถานะได้อย่างเดียว
    - เปิดลิงก์ที่มี ?key=...  → แอดมินอัปเดตสถานะได้
  การตรวจสิทธิ์อยู่ที่ฝั่งเซิร์ฟเวอร์ ไม่ได้อาศัยการซ่อนปุ่มบนหน้าเว็บอย่างเดียว
-->
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1b1f27;
    --muted: #6b7280;
    --line: #e2e5ea;
    --primary: #2563eb;
    --err-bg: #fdecec;
    --err-text: #9b1c1c;
    --radius: 12px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --card: #1e2127;
      --text: #eceef2;
      --muted: #9aa1ad;
      --line: #333842;
      --err-bg: #3a1a1a;
      --err-text: #f5b5b5;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 0 0 48px;
    background: var(--bg);
    color: var(--text);
    font-family: "Noto Sans Thai", "Sarabun", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 16px;
    line-height: 1.55;
    -webkit-text-size-adjust: 100%;
  }

  .wrap { max-width: 720px; margin: 0 auto; padding: 0 14px; }

  header.app {
    background: var(--primary);
    color: #fff;
    padding: calc(14px + env(safe-area-inset-top)) 14px 14px;
    margin-bottom: 14px;
  }
  header.app h1 { font-size: 19px; margin: 0; font-weight: 600; }
  header.app .sub { font-size: 13px; opacity: .85; margin-top: 4px; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 14px;
  }
  .card h2 { font-size: 15px; margin: 0 0 12px; color: var(--muted); font-weight: 600; }

  label { display: block; font-size: 14px; margin-bottom: 5px; color: var(--muted); }

  input, select, button { font-family: inherit; font-size: 16px; color: var(--text); }

  input, select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--card);
    margin-bottom: 12px;
  }

  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; min-width: 0; }

  button.primary {
    width: 100%;
    padding: 13px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-weight: 600;
    font-size: 16px;
    cursor: pointer;
  }
  button.primary:disabled { opacity: .6; cursor: default; }

  button.ghost {
    width: 100%;
    padding: 10px;
    background: none;
    border: 1px dashed var(--line);
    color: var(--primary);
    border-radius: 10px;
    font-size: 15px;
    cursor: pointer;
    margin-top: 8px;
  }

  .banner { border-radius: 10px; padding: 12px; font-size: 15px; margin-bottom: 12px; }
  .banner.err { background: var(--err-bg); color: var(--err-text); }

  .muted { color: var(--muted); font-size: 14px; }
  .hidden { display: none !important; }

  /* สรุปจำนวนตามสถานะ */
  .summary { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .summary .box {
    flex: 1 1 130px;
    background: var(--card);
    border: 1px solid var(--line);
    border-left: 4px solid var(--s-color, var(--muted));
    border-radius: 10px;
    padding: 10px 12px;
  }
  .summary .box .n { font-size: 22px; font-weight: 700; }
  .summary .box .t { font-size: 13px; color: var(--muted); }

  /* การ์ดรายการแบต */
  .bat {
    background: var(--card);
    border: 1px solid var(--line);
    border-left: 5px solid var(--s-color, var(--muted));
    border-radius: var(--radius);
    padding: 12px;
    margin-bottom: 10px;
  }
  .bat .head { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); }
  .bat .branch { font-size: 17px; font-weight: 600; margin: 4px 0; }
  .bat .meta { font-size: 14px; color: var(--muted); }
  .badge {
    display: inline-block;
    background: var(--s-color, var(--muted));
    color: #fff;
    border-radius: 999px;
    padding: 3px 12px;
    font-size: 13px;
    font-weight: 600;
    margin: 6px 0;
  }
  .bat select { margin: 8px 0 0; }

  /* บล็อกแบตแต่ละก้อนในฟอร์ม */
  .items { margin-top: 4px; }
  .item {
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 10px 2px;
    margin-bottom: 10px;
    background: var(--bg);
  }
  .item .no { font-size: 13px; color: var(--muted); margin-bottom: 6px; display: flex; justify-content: space-between; }
  .item .del {
    background: none; border: none; color: var(--err-text);
    font-size: 13px; cursor: pointer; padding: 0;
  }

  /* สีประจำสถานะ ให้ดูปราดเดียวรู้ว่าอยู่ขั้นไหน */
  .s0 { --s-color: #9333ea; }
  .s1 { --s-color: #f59e0b; }
  .s2 { --s-color: #16a34a; }
  .s3 { --s-color: #0891b2; }
  .s4 { --s-color: #2563eb; }
</style>

<header class="app">
  <h1>🔋 สถานะการกระตุ้นแบตเตอรี่</h1>
  <div class="sub" id="modeLabel"></div>
</header>

<div class="wrap">

  <div id="loading" class="card"><div class="muted">กำลังโหลดข้อมูล…</div></div>

  <div id="fatal" class="card hidden">
    <div class="banner err" id="fatalMsg"></div>
    <button class="primary" onclick="location.reload()">ลองใหม่</button>
  </div>

  <!-- ฟอร์มเพิ่ม/แก้ไข เฉพาะแอดมิน -->
  <div id="formCard" class="card hidden">
    <h2 id="formTitle">เพิ่มรายการแบตเตอรี่</h2>

    <label for="fBranch">สาขาเจ้าของแบต *</label>
    <select id="fBranch"><option value="">— เลือกสาขา —</option></select>

    <div class="row">
      <div>
        <label for="fDate">วันที่รับเข้า</label>
        <input type="date" id="fDate">
      </div>
      <div>
        <label for="fAl">อล.</label>
        <input type="text" id="fAl" autocomplete="off" placeholder="เลขที่ อล.">
      </div>
    </div>

    <label for="fStatus">สถานะ</label>
    <select id="fStatus"></select>

    <label for="fBy">ผู้อัปเดต</label>
    <input type="text" id="fBy" autocomplete="off" placeholder="ชื่อผู้ดูแล">

    <div class="items">
      <label id="itemsLabel">รายการแบต</label>
      <div id="itemRows"></div>
      <button type="button" class="ghost" id="addItemBtn">+ เพิ่มแบตอีกก้อน</button>
    </div>

    <div id="formMsg" class="banner err hidden"></div>
    <button class="primary" id="saveBtn">บันทึก</button>
    <button type="button" class="ghost" id="cancelBtn">ยกเลิก</button>
  </div>

  <!-- ตัวกรอง -->
  <div class="card" id="filterCard">
    <label for="q">ค้นหา</label>
    <input type="search" id="q" placeholder="เลขที่รายการ / ซีเรียล / รุ่น / หมายเหตุ">

    <div class="row">
      <div>
        <label for="branchFilter">สาขา</label>
        <select id="branchFilter"><option value="">— ทุกสาขา —</option></select>
      </div>
      <div>
        <label for="statusFilter">สถานะ</label>
        <select id="statusFilter"><option value="">— ทุกสถานะ —</option></select>
      </div>
    </div>

    <button class="primary" id="searchBtn">ค้นหา</button>
    <button type="button" class="ghost hidden" id="newBtn">+ เพิ่มรายการแบตเตอรี่</button>
  </div>

  <div id="summary" class="summary"></div>
  <div id="status" class="card hidden"></div>
  <div id="results"></div>
</div>

<!--
  ค่าจากเซิร์ฟเวอร์ส่งผ่าน data attribute ไม่ใช่แปะกลางบล็อกโค้ด
  เพราะ scriptlet ของ Apps Script จะ escape ให้ตามบริบท HTML
  ถ้าเอา JSON ไปแปะกลางโค้ด JS เครื่องหมายคำพูดจะเพี้ยน
  ค่าที่ได้จะไม่ใช่ค่าที่ตั้งใจส่ง ส่วนใน attribute
  เบราว์เซอร์ถอด entity กลับให้เองอยู่แล้ว
-->
<div id="cfg" class="hidden" data-config="<?= configJson ?>"></div>

<script>
  var CFG = {};
  try {
    CFG = JSON.parse(document.getElementById('cfg').getAttribute('data-config') || '{}');
  } catch (err) {
    CFG = {};
  }
  var IS_ADMIN = CFG.isAdmin === true;
  var ADMIN_KEY = typeof CFG.adminKey === 'string' ? CFG.adminKey : '';
  var LOCK_BRANCH = typeof CFG.lockBranch === 'string' ? CFG.lockBranch : '';

  var STATUSES = [];
  var editingId = '';
  var items = [];

  function $(id) { return document.getElementById(id); }

  function call(fnName, arg) {
    return new Promise(function (resolve, reject) {
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fnName](arg);
    });
  }

  function statusClass(status) {
    var i = STATUSES.indexOf(status);
    return i < 0 ? '' : 's' + i;
  }

  function boot() {
    $('modeLabel').textContent = IS_ADMIN
      ? 'โหมดแอดมิน — อัปเดตสถานะได้'
      : 'ดูสถานะอย่างเดียว';

    call('apiBatteryBootstrap').then(function (res) {
      if (!res || !res.ok) throw new Error((res && res.error) || 'โหลดข้อมูลไม่สำเร็จ');

      STATUSES = res.statuses;
      res.branches.forEach(function (b) {
        $('branchFilter').appendChild(new Option(b, b));
        $('fBranch').appendChild(new Option(b, b));
      });
      STATUSES.forEach(function (s) {
        $('statusFilter').appendChild(new Option(s, s));
        $('fStatus').appendChild(new Option(s, s));
      });
      $('fDate').value = res.today;

      // ลิงก์ที่เจาะจงสาขา ให้ล็อกตัวกรองไว้เลย
      if (LOCK_BRANCH) {
        $('branchFilter').value = LOCK_BRANCH;
        $('branchFilter').disabled = true;
        $('modeLabel').textContent += ' • เฉพาะสาขา ' + LOCK_BRANCH;
      } else if (CFG.lockBranchInvalid) {
        $('modeLabel').textContent += ' • ไม่พบสาขา "' + CFG.wantBranch + '" จึงแสดงทุกสาขา';
      }

      if (IS_ADMIN) $('newBtn').classList.remove('hidden');

      $('loading').classList.add('hidden');
      search();
    }).catch(function (err) {
      $('loading').classList.add('hidden');
      $('fatal').classList.remove('hidden');
      $('fatalMsg').textContent = 'โหลดข้อมูลไม่สำเร็จ: ' + (err.message || err);
    });
  }

  // ห่อไว้ ไม่งั้น event object จะกลายเป็น doneMsg ไปโผล่บนหน้าจอ
  $('searchBtn').addEventListener('click', function () { search(); });
  $('q').addEventListener('keydown', function (e) { if (e.key === 'Enter') search(); });
  $('newBtn').addEventListener('click', function () { openForm(null); });
  $('cancelBtn').addEventListener('click', closeForm);
  $('saveBtn').addEventListener('click', save);
  $('addItemBtn').addEventListener('click', function () {
    collectItems();
    items.push(blankItem());
    renderItems();
    var rows = $('itemRows').querySelectorAll('.item input');
    if (rows.length) rows[rows.length - 4].focus();
  });

  function setStatus(msg, isError) {
    var box = $('status');
    box.classList.remove('hidden');
    box.innerHTML = '';
    var div = document.createElement('div');
    div.className = isError ? 'banner err' : 'muted';
    div.textContent = msg;
    box.appendChild(div);
  }

  /** doneMsg = ข้อความที่อยากให้ค้างไว้หลังโหลดเสร็จ เช่น "บันทึกแล้ว" */
  function search(doneMsg) {
    setStatus('กำลังโหลด…');
    $('results').innerHTML = '';
    call('apiListBatteries', {
      q: $('q').value.trim(),
      branch: LOCK_BRANCH || $('branchFilter').value,
      status: $('statusFilter').value
    }).then(function (res) {
      if (!res || !res.ok) return setStatus((res && res.error) || 'โหลดไม่สำเร็จ', true);
      renderSummary(res.counts);
      render(res.results, res.total);
      if (doneMsg) setStatus(doneMsg);
    }).catch(function (err) {
      setStatus('โหลดไม่สำเร็จ: ' + (err.message || err), true);
    });
  }

  function renderSummary(counts) {
    var box = $('summary');
    box.innerHTML = '';
    STATUSES.forEach(function (s, i) {
      var el = document.createElement('div');
      el.className = 'box s' + i;
      var n = document.createElement('div');
      n.className = 'n';
      n.textContent = counts[s] || 0;
      var t = document.createElement('div');
      t.className = 't';
      t.textContent = s;
      el.appendChild(n);
      el.appendChild(t);
      box.appendChild(el);
    });
  }

  function render(rows, total) {
    if (!rows.length) {
      // แยกให้ชัดว่า "ยังไม่มีข้อมูลเลย" กับ "มีข้อมูลแต่ตัวกรองไม่ตรง" คนละเรื่องกัน
      return setStatus(total
        ? 'ในระบบมี ' + total + ' รายการ แต่ไม่มีรายการไหนตรงกับตัวกรองที่เลือกไว้'
        : 'ยังไม่มีรายการแบตในระบบ');
    }
    setStatus('พบ ' + rows.length + ' รายการ (ล่าสุดขึ้นก่อน)');

    var box = $('results');
    rows.forEach(function (b) {
      var el = document.createElement('div');
      el.className = 'bat ' + statusClass(b.status);

      var head = document.createElement('div');
      head.className = 'head';
      var left = document.createElement('span');
      left.textContent = b.batteryId;
      var right = document.createElement('span');
      right.textContent = b.receivedDate ? 'รับเข้า ' + thaiDate(b.receivedDate) : '';
      head.appendChild(left);
      head.appendChild(right);
      el.appendChild(head);

      var branch = document.createElement('div');
      branch.className = 'branch';
      branch.textContent = b.branch + (b.zone ? ' (เขต' + b.zone + ')' : '');
      el.appendChild(branch);

      var badge = document.createElement('div');
      badge.className = 'badge';
      badge.textContent = b.status || 'ยังไม่ระบุสถานะ';
      el.appendChild(badge);

      var bits = [];
      if (b.qty) bits.push(b.qty + ' ลูก');
      if (b.alNo) bits.push('อล. ' + b.alNo);
      if (b.model) bits.push(b.model);
      if (b.serial) bits.push('ซีเรียล ' + b.serial);
      if (bits.length) {
        var meta = document.createElement('div');
        meta.className = 'meta';
        meta.textContent = bits.join('  •  ');
        el.appendChild(meta);
      }

      if (b.note) {
        var note = document.createElement('div');
        note.className = 'meta';
        note.textContent = '📝 ' + b.note;
        el.appendChild(note);
      }

      if (b.updatedAt) {
        var upd = document.createElement('div');
        upd.className = 'meta';
        upd.style.marginTop = '6px';
        upd.textContent = 'อัปเดตล่าสุด ' + b.updatedAt + (b.updatedBy ? ' โดย ' + b.updatedBy : '');
        el.appendChild(upd);
      }

      // ปุ่มแก้ไขและช่องเปลี่ยนสถานะ มีเฉพาะโหมดแอดมิน
      if (IS_ADMIN) {
        var sel = document.createElement('select');
        STATUSES.forEach(function (s) { sel.appendChild(new Option(s, s)); });
        sel.value = b.status;
        sel.addEventListener('change', function () {
          sel.disabled = true;
          call('apiUpdateBatteryStatus', {
            key: ADMIN_KEY, batteryId: b.batteryId, status: sel.value,
            updatedBy: localStorage.getItem('bt_by') || ''
          }).then(function (res) {
            sel.disabled = false;
            if (!res || !res.ok) return setStatus((res && res.error) || 'อัปเดตไม่สำเร็จ', true);
            search();
          }).catch(function (err) {
            sel.disabled = false;
            setStatus('อัปเดตไม่สำเร็จ: ' + (err.message || err), true);
          });
        });
        el.appendChild(sel);

        var edit = document.createElement('button');
        edit.className = 'ghost';
        edit.textContent = 'แก้ไขรายละเอียด';
        edit.addEventListener('click', function () { openForm(b); });
        el.appendChild(edit);
      }

      box.appendChild(el);
    });
  }

  function blankItem() { return { serial: '', model: '', qty: '1', note: '' }; }

  /* ----- รายการแบตหลายก้อนในฟอร์มเดียว ----- */

  function renderItems() {
    var box = $('itemRows');
    box.innerHTML = '';
    items.forEach(function (it, idx) {
      var el = document.createElement('div');
      el.className = 'item';

      var head = document.createElement('div');
      head.className = 'no';
      var label = document.createElement('span');
      label.textContent = editingId ? 'รายละเอียด' : 'ก้อนที่ ' + (idx + 1);
      head.appendChild(label);
      if (!editingId && items.length > 1) {
        var del = document.createElement('button');
        del.type = 'button';
        del.className = 'del';
        del.textContent = 'ลบก้อนนี้';
        del.addEventListener('click', function () {
          collectItems();
          items.splice(idx, 1);
          renderItems();
        });
        head.appendChild(del);
      }
      el.appendChild(head);

      var row = document.createElement('div');
      row.className = 'row';
      row.appendChild(field('ซีเรียล/รหัสแบต', 'text', it.serial, 'serial', idx, ''));
      row.appendChild(field('รุ่น/ขนาด', 'text', it.model, 'model', idx, 'เช่น 12V 25-27Ah'));
      el.appendChild(row);

      var row2 = document.createElement('div');
      row2.className = 'row';
      row2.appendChild(field('จำนวน (ลูก)', 'number', it.qty, 'qty', idx, ''));
      row2.appendChild(field('หมายเหตุ', 'text', it.note, 'note', idx, ''));
      el.appendChild(row2);

      box.appendChild(el);
    });
    $('addItemBtn').classList.toggle('hidden', !!editingId);
    $('itemsLabel').textContent = editingId
      ? 'รายละเอียดแบต'
      : 'รายการแบต (' + items.length + ' ก้อน)';
  }

  function field(labelText, type, value, name, idx, placeholder) {
    var wrap = document.createElement('div');
    var lab = document.createElement('label');
    lab.textContent = labelText;
    var inp = document.createElement('input');
    inp.type = type;
    inp.value = value == null ? '' : value;
    inp.setAttribute('data-name', name);
    inp.setAttribute('data-idx', String(idx));
    inp.autocomplete = 'off';
    if (placeholder) inp.placeholder = placeholder;
    if (type === 'number') { inp.min = '1'; inp.step = '1'; }
    wrap.appendChild(lab);
    wrap.appendChild(inp);
    return wrap;
  }

  /** ดึงค่าที่พิมพ์ไว้กลับเข้า items ก่อนวาดใหม่ ไม่งั้นของที่พิมพ์ค้างจะหาย */
  function collectItems() {
    var inputs = $('itemRows').querySelectorAll('input[data-name]');
    for (var i = 0; i < inputs.length; i++) {
      var idx = Number(inputs[i].getAttribute('data-idx'));
      if (items[idx]) items[idx][inputs[i].getAttribute('data-name')] = inputs[i].value;
    }
  }

  function openForm(b) {
    editingId = b ? b.batteryId : '';
    $('formTitle').textContent = b ? 'แก้ไข ' + b.batteryId : 'เพิ่มรายการแบตเตอรี่';
    $('fBranch').value = b ? b.branch : (LOCK_BRANCH || '');
    $('fDate').value = b ? b.receivedDate : $('fDate').value;
    $('fAl').value = b ? (b.alNo || '') : '';
    $('fStatus').value = b ? b.status : STATUSES[0];
    $('fBy').value = localStorage.getItem('bt_by') || '';

    items = b
      ? [{ serial: b.serial, model: b.model, qty: b.qty || '1', note: b.note }]
      : [blankItem()];
    renderItems();

    $('formMsg').classList.add('hidden');
    $('formCard').classList.remove('hidden');
    $('filterCard').classList.add('hidden');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function closeForm() {
    $('formCard').classList.add('hidden');
    $('filterCard').classList.remove('hidden');
    editingId = '';
    items = [];
  }

  function formError(msg) {
    $('formMsg').textContent = msg;
    $('formMsg').classList.remove('hidden');
  }

  function save() {
    collectItems();

    var payload = {
      key: ADMIN_KEY,
      branch: $('fBranch').value,
      receivedDate: $('fDate').value,
      alNo: $('fAl').value.trim(),
      status: $('fStatus').value,
      updatedBy: $('fBy').value.trim(),
      items: items.map(function (it) {
        return {
          serial: String(it.serial || '').trim(),
          model: String(it.model || '').trim(),
          qty: String(it.qty || '').trim() || '1',
          note: String(it.note || '').trim()
        };
      })
    };
    if (editingId) payload.items[0].batteryId = editingId;

    if (!payload.branch) return formError('ยังไม่ได้เลือกสาขา');
    for (var i = 0; i < payload.items.length; i++) {
      if (!(Number(payload.items[i].qty) > 0)) {
        return formError('ก้อนที่ ' + (i + 1) + ' ใส่จำนวนไม่ถูกต้อง');
      }
    }
    localStorage.setItem('bt_by', payload.updatedBy);

    $('saveBtn').disabled = true;
    $('saveBtn').textContent = 'กำลังบันทึก…';

    call('apiSaveBatteries', payload).then(function (res) {
      $('saveBtn').disabled = false;
      $('saveBtn').textContent = 'บันทึก';
      if (!res || !res.ok) return formError((res && res.error) || 'บันทึกไม่สำเร็จ');
      var msg = editingId ? 'บันทึกการแก้ไขแล้ว' : 'บันทึกแบต ' + (res.count || 0) + ' รายการแล้ว';
      closeForm();
      search(msg);
    }).catch(function (err) {
      $('saveBtn').disabled = false;
      $('saveBtn').textContent = 'บันทึก';
      formError('บันทึกไม่สำเร็จ: ' + (err.message || err));
    });
  }

  function thaiDate(iso) {
    var m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
    return m ? m[3] + '/' + m[2] + '/' + m[1] : iso;
  }

  boot();
</script>
