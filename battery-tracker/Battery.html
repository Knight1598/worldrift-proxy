<!--
  หน้าติดตามสถานะการกระตุ้นแบตเตอรี่
  ก็อปไฟล์นี้ไปวางใน Apps Script เป็นไฟล์ชนิด HTML ชื่อ Battery

  หน้าเดียวใช้ได้ 2 โหมด:
    - เปิดลิงก์ธรรมดา          → สาขาดูสถานะได้อย่างเดียว
    - เปิดลิงก์ที่มี ?key=...  → แอดมินอัปเดตสถานะได้
  การตรวจสิทธิ์อยู่ที่ฝั่งเซิร์ฟเวอร์ ไม่ได้อาศัยการซ่อนปุ่มบนหน้าเว็บอย่างเดียว
-->
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1b1f27;
    --muted: #6b7280;
    --line: #e2e5ea;
    --primary: #2563eb;
    --err-bg: #fdecec;
    --err-text: #9b1c1c;
    --radius: 12px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --card: #1e2127;
      --text: #eceef2;
      --muted: #9aa1ad;
      --line: #333842;
      --err-bg: #3a1a1a;
      --err-text: #f5b5b5;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 0 0 48px;
    background: var(--bg);
    color: var(--text);
    font-family: "Noto Sans Thai", "Sarabun", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 16px;
    line-height: 1.55;
    -webkit-text-size-adjust: 100%;
  }

  .wrap { max-width: 720px; margin: 0 auto; padding: 0 14px; }

  header.app {
    background: var(--primary);
    color: #fff;
    padding: calc(14px + env(safe-area-inset-top)) 14px 14px;
    margin-bottom: 14px;
  }
  header.app h1 { font-size: 19px; margin: 0; font-weight: 600; }
  header.app .sub { font-size: 13px; opacity: .85; margin-top: 4px; }
  .head-row { display: flex; align-items: flex-start; gap: 10px; }
  .head-text { flex: 1; min-width: 0; }

  /* ปุ่มกุญแจมุมขวาบน — ทางเข้าโหมดแอดมิน */
  .key-btn {
    flex: none;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, .45);
    background: rgba(255, 255, 255, .15);
    color: #fff;
    font-size: 19px;
    line-height: 1;
    cursor: pointer;
    padding: 0;
  }
  .key-btn.on { background: #fff; border-color: #fff; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 14px;
  }
  .card h2 { font-size: 15px; margin: 0 0 12px; color: var(--muted); font-weight: 600; }

  label { display: block; font-size: 14px; margin-bottom: 5px; color: var(--muted); }

  input, select, button { font-family: inherit; font-size: 16px; color: var(--text); }

  input, select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--card);
    margin-bottom: 12px;
  }

  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; min-width: 0; }

  button.primary {
    width: 100%;
    padding: 13px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-weight: 600;
    font-size: 16px;
    cursor: pointer;
  }
  button.primary:disabled { opacity: .6; cursor: default; }

  button.ghost {
    width: 100%;
    padding: 10px;
    background: none;
    border: 1px dashed var(--line);
    color: var(--primary);
    border-radius: 10px;
    font-size: 15px;
    cursor: pointer;
    margin-top: 8px;
  }

  .banner { border-radius: 10px; padding: 12px; font-size: 15px; margin-bottom: 12px; }
  .banner.err { background: var(--err-bg); color: var(--err-text); }

  .muted { color: var(--muted); font-size: 14px; }
  .hidden { display: none !important; }

  /* ช่องเลือกแบบพิมพ์ค้นหาได้ (ใช้กับสาขา 166 แห่ง) */
  .combo { position: relative; margin-bottom: 12px; }
  .combo input { margin-bottom: 0; }
  .combo.disabled input { opacity: .55; }

  .combo-list {
    list-style: none;
    margin: 4px 0 0;
    padding: 4px;
    position: absolute;
    left: 0;
    right: 0;
    z-index: 30;
    max-height: 270px;
    overflow-y: auto;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,.18);
    -webkit-overflow-scrolling: touch;
  }

  .combo-item {
    padding: 11px 12px;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
  }
  .combo-item.active { background: var(--primary); color: #fff; }
  .combo-item .sub { font-size: 13px; color: var(--muted); margin-left: 6px; }
  .combo-item.active .sub { color: rgba(255,255,255,.8); }
  .combo-empty { padding: 11px 12px; font-size: 14px; color: var(--muted); }


  /* สรุปจำนวนตามสถานะ */
  .summary { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .summary .box {
    flex: 1 1 130px;
    background: var(--card);
    border: 1px solid var(--line);
    border-left: 4px solid var(--s-color, var(--muted));
    border-radius: 10px;
    padding: 10px 12px;
  }
  .summary .box .n { font-size: 22px; font-weight: 700; }
  .summary .box .t { font-size: 13px; color: var(--muted); }

  /* การ์ดรายการแบต */
  .bat {
    background: var(--card);
    border: 1px solid var(--line);
    border-left: 5px solid var(--s-color, var(--muted));
    border-radius: var(--radius);
    padding: 12px;
    margin-bottom: 10px;
  }
  .bat .head { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); }
  .bat .branch { font-size: 17px; font-weight: 600; margin: 4px 0; }
  .bat .meta { font-size: 14px; color: var(--muted); }
  .badge {
    display: inline-block;
    background: var(--s-color, var(--muted));
    color: #fff;
    border-radius: 999px;
    padding: 3px 12px;
    font-size: 13px;
    font-weight: 600;
    margin: 6px 0;
  }
  .bat select { margin: 8px 0 0; }

  /* แถวปุ่มจัดการ และแผงแก้ไขที่กางอยู่ในการ์ด */
  .card-actions { display: flex; gap: 8px; margin-top: 8px; }
  .card-actions button { margin-top: 0; }
  button.ghost.danger { color: var(--err-text); border-color: var(--err-text); }
  .card-edit {
    margin-top: 10px;
    padding: 12px 12px 4px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 10px;
  }
  .card-edit .row { gap: 8px; }

  /* กล่องใบบันทึกการจัดส่งบนการ์ด */
  .dlv-box {
    margin-top: 8px;
    padding: 10px 12px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 10px;
  }
  .dlv-head { font-size: 14px; font-weight: 600; margin-bottom: 4px; }

  /* บล็อกแบตแต่ละก้อนในฟอร์ม */
  .items { margin-top: 4px; }
  .item {
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 10px 2px;
    margin-bottom: 10px;
    background: var(--bg);
  }
  .item .no { font-size: 13px; color: var(--muted); margin-bottom: 6px; display: flex; justify-content: space-between; }
  .item .del {
    background: none; border: none; color: var(--err-text);
    font-size: 13px; cursor: pointer; padding: 0;
  }

  /* แถบสลับระหว่างงานแบตกับงานซ่อมรถ */
  .tabs {
    display: flex;
    background: var(--card);
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    z-index: 5;
    margin-bottom: 14px;
  }
  .tab {
    flex: 1;
    padding: 13px 8px;
    background: none;
    border: none;
    border-bottom: 3px solid transparent;
    color: var(--muted);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .tab.active { color: var(--primary); border-bottom-color: var(--primary); }

  /* สีประจำสถานะ ให้ดูปราดเดียวรู้ว่าอยู่ขั้นไหน */
  .s0 { --s-color: #9333ea; }
  .s1 { --s-color: #f59e0b; }
  .s2 { --s-color: #16a34a; }
  .s3 { --s-color: #0891b2; }
  .s4 { --s-color: #2563eb; }

  /* งานซ่อมใช้ชุดสีของตัวเอง จบงานแล้วต้องเป็นเขียว ไม่ใช่กลางทางเป็นเขียว */
  .r0 { --s-color: #9333ea; }   /* รอซ่อม */
  .r1 { --s-color: #dc2626; }   /* รออะไหล่ — ติดของ ต้องสะดุดตา */
  .r2 { --s-color: #f59e0b; }   /* กำลังซ่อม */
  .r3 { --s-color: #16a34a; }   /* ซ่อมเสร็จแล้ว */
</style>

<!--
  ค่าจากเซิร์ฟเวอร์ส่งผ่าน data attribute ไม่ใช่แปะกลางบล็อกโค้ด
  เพราะ scriptlet ของ Apps Script จะ escape ให้ตามบริบท HTML
  ถ้าเอา JSON ไปแปะกลางโค้ด JS เครื่องหมายคำพูดจะเพี้ยน
  ค่าที่ได้จะไม่ใช่ค่าที่ตั้งใจส่ง ส่วนใน attribute
  เบราว์เซอร์ถอด entity กลับให้เองอยู่แล้ว
-->
<div id="cfg" class="hidden" data-config="<?= configJson ?>"></div>

<script>
  var CFG = {};
  try {
    CFG = JSON.parse(document.getElementById('cfg').getAttribute('data-config') || '{}');
  } catch (err) {
    CFG = {};
  }
  var IS_ADMIN = CFG.isAdmin === true;
  var ADMIN_KEY = typeof CFG.adminKey === 'string' ? CFG.adminKey : '';
  var LOCK_BRANCH = typeof CFG.lockBranch === 'string' ? CFG.lockBranch : '';

  var STATUSES = [];          // ขั้นตอนงานแบต
  var R_STATUSES = [];        // ขั้นตอนงานซ่อมรถ
  var editingId = '';
  var rEditingId = '';
  var cbBranch = null, cbBranchFilter = null, cbRBranch = null, cbRBranchFilter = null;
  var APP_URL = '';              // ใช้ทำลิงก์เปิดรูป (หน้าอยู่ในไอเฟรม อ่าน URL เองไม่ได้)
  var DELIVERED_STATUS = 'จัดส่งแล้ว';
  var dlvBattery = null;         // แบตก้อนที่กำลังกรอกใบจัดส่งให้
  var dlvImage = null;           // { base64, mimeType, dataUrl }
  var searchSeq = 0, rSearchSeq = 0;   // ลำดับคำขอ ใช้ทิ้งผลลัพธ์ที่ล้าสมัย
  var cardSeq = 0;                     // เลขรันสำหรับ id ของช่องในการ์ด
  var BRANCH_OPTIONS = [];             // ตัวเลือกสาขา ใช้ซ้ำในช่องที่สร้างในการ์ด
  var items = [];

  function $(id) { return document.getElementById(id); }

  function call(fnName, arg) {
    return new Promise(function (resolve, reject) {
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fnName](arg);
    });
  }

  /* ---------- ช่องเลือกแบบพิมพ์ค้นหาได้ ----------
   * ใช้แทน <select> ที่มีตัวเลือกเยอะ (เขต 53 / สาขา 166)
   * พิมพ์เลขหรือชื่อก็ได้ เพราะจับคู่แบบ substring บนข้อความเต็มของตัวเลือก
   */
  function makeCombo(hostId, config) {
    config = config || {};
    var host = $(hostId);
    var options = [];
    var filtered = [];
    var value = '';
    var activeIndex = -1;
    var open = false;
    var blurTimer = null;
    var scope = null;   // ฟังก์ชันจำกัดขอบเขตตัวเลือก เช่น เอาเฉพาะสาขาในเขตที่เลือกไว้
    var remoteTimer = null;
    var remoteSeq = 0;  // กันผลลัพธ์เก่าที่กลับมาช้ามาทับผลใหม่

    var input = document.createElement('input');
    input.type = 'text';
    input.id = hostId + '-input';
    input.autocomplete = 'off';
    input.setAttribute('role', 'combobox');
    input.setAttribute('aria-expanded', 'false');
    input.placeholder = config.placeholder || '';

    var list = document.createElement('ul');
    list.className = 'combo-list hidden';

    host.appendChild(input);
    host.appendChild(list);

    function norm(s) { return String(s == null ? '' : s).toLowerCase().replace(/\s+/g, ''); }

    function labelOf(v) {
      for (var i = 0; i < options.length; i++) {
        if (options[i].value === v) return options[i].label;
      }
      return '';
    }

    function matches(pool, q) {
      return q
        ? pool.filter(function (o) { return norm(o.label + ' ' + (o.sub || '')).indexOf(q) >= 0; })
        : pool.slice();
    }

    function filter(query) {
      var q = norm(query);
      if (scope) {
        filtered = matches(options.filter(scope), q);
        // ถ้าในขอบเขตไม่เจอ ให้ค้นจากทั้งหมดแทน (เช่น พิมพ์สาขาที่อยู่คนละเขตกับที่เลือกไว้)
        if (!filtered.length && q) filtered = matches(options, q);
      } else {
        filtered = matches(options, q);
      }
      if (filtered.length > 50) filtered = filtered.slice(0, 50);
    }

    function renderMessage(text) {
      list.innerHTML = '';
      var el = document.createElement('li');
      el.className = 'combo-empty';
      el.textContent = text;
      list.appendChild(el);
    }

    function render() {
      list.innerHTML = '';
      if (!filtered.length) {
        var empty = document.createElement('li');
        empty.className = 'combo-empty';
        empty.textContent = config.emptyText || 'ไม่พบรายการที่ตรง';
        list.appendChild(empty);
        return;
      }
      filtered.forEach(function (o, i) {
        var li = document.createElement('li');
        li.className = 'combo-item' + (i === activeIndex ? ' active' : '');
        li.textContent = o.label;
        if (o.sub) {
          var sub = document.createElement('span');
          sub.className = 'sub';
          sub.textContent = o.sub;
          li.appendChild(sub);
        }
        // ใช้ mousedown/touchstart เพราะ blur ของ input จะยิงก่อน click
        li.addEventListener('mousedown', function (e) { e.preventDefault(); choose(o); });
        list.appendChild(li);
      });
    }

    function openList(query) {
      // ยกเลิกการปิดที่ค้างคิวอยู่จากการ blur ครั้งก่อน ไม่งั้นมันจะมาปิดรายการที่เพิ่งกางทิ้ง
      if (blurTimer) { clearTimeout(blurTimer); blurTimer = null; }

      if (config.remote) return openRemote(query === undefined ? '' : query);

      filter(query === undefined ? '' : query);
      activeIndex = filtered.length ? 0 : -1;
      render();
      show();
    }

    function show() {
      list.classList.remove('hidden');
      input.setAttribute('aria-expanded', 'true');
      open = true;
    }

    /** โหมดค้นจากเซิร์ฟเวอร์ — ใช้กับรายการสินค้าที่มีเยอะเกินกว่าจะโหลดมาทั้งหมด */
    function openRemote(query) {
      var q = String(query || '').trim();
      var minChars = config.minChars || 2;

      if (remoteTimer) { clearTimeout(remoteTimer); remoteTimer = null; }

      if (q.length < minChars) {
        filtered = [];
        activeIndex = -1;
        renderMessage('พิมพ์อย่างน้อย ' + minChars + ' ตัวอักษรเพื่อค้นหา');
        show();
        return;
      }

      renderMessage('กำลังค้นหา…');
      show();

      var seq = ++remoteSeq;
      remoteTimer = setTimeout(function () {
        remoteTimer = null;
        config.remote(q, function (results) {
          if (seq !== remoteSeq) return;   // มีการพิมพ์ต่อไปแล้ว ทิ้งผลเก่า
          options = (results || []).map(function (o) {
            return typeof o === 'string' ? { value: o, label: o } : o;
          });
          filtered = options.slice(0, 50);
          activeIndex = filtered.length ? 0 : -1;
          render();
          show();
        });
      }, config.debounce || 250);
    }

    function closeList() {
      list.classList.add('hidden');
      input.setAttribute('aria-expanded', 'false');
      open = false;
      activeIndex = -1;
    }

    function choose(option) {
      value = option.value;
      input.value = option.label;
      closeList();
      if (config.onChange) config.onChange(value, option);
    }

    input.addEventListener('input', function () {
      if (config.freeText) value = input.value.trim();
      openList(input.value);
    });
    input.addEventListener('focus', function () { openList(config.remote ? input.value : ''); });

    input.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        if (!open) return openList(input.value);
        if (!filtered.length) return;
        activeIndex = e.key === 'ArrowDown'
          ? (activeIndex + 1) % filtered.length
          : (activeIndex - 1 + filtered.length) % filtered.length;
        render();
        var el = list.children[activeIndex];
        if (el && el.scrollIntoView) el.scrollIntoView({ block: 'nearest' });
      } else if (e.key === 'Enter') {
        if (open && activeIndex >= 0 && filtered[activeIndex]) {
          e.preventDefault();
          choose(filtered[activeIndex]);
        }
      } else if (e.key === 'Escape') {
        closeList();
      }
    });

    // พิมพ์ค้างไว้แล้วคลิกออกโดยไม่ได้เลือก → คืนข้อความเป็นค่าที่เลือกไว้ล่าสุด
    input.addEventListener('blur', function () {
      blurTimer = setTimeout(function () {
        blurTimer = null;
        closeList();
        if (config.freeText) {
          // ช่องที่ยอมให้พิมพ์ค่าที่ไม่มีในรายการ (เช่น รหัสสินค้าที่ยังไม่ได้นำเข้า)
          value = input.value.trim();
          if (config.onBlur) config.onBlur(value);
          return;
        }
        input.value = value ? labelOf(value) : '';
      }, 120);
    });

    return {
      el: host,
      input: input,
      setOptions: function (list_) {
        options = (list_ || []).map(function (o) {
          return typeof o === 'string' ? { value: o, label: o } : o;
        });
        // ถ้าค่าที่เลือกไว้เดิมไม่มีในชุดใหม่ ต้องล้างทิ้ง ไม่งั้นจะส่งค่าเก่าไปบันทึกทั้งที่ช่องดูว่าง
        // (ยกเว้นช่องที่ยอมให้พิมพ์ค่านอกรายการ)
        if (!config.freeText && value && !labelOf(value)) { value = ''; input.value = ''; }
      },
      getValue: function () { return value; },
      setValue: function (v) {
        value = v || '';
        input.value = value ? labelOf(value) : '';
      },
      /** ตั้งค่าที่ไม่ได้อยู่ในรายการ (ใช้กับช่องโหมด freeText เช่น รหัสสินค้า) */
      setFreeValue: function (v) {
        value = v || '';
        input.value = value;
      },
      clear: function () { value = ''; input.value = ''; closeList(); },
      setEnabled: function (on) {
        input.disabled = !on;
        host.classList.toggle('disabled', !on);
        if (!on) { value = ''; input.value = ''; closeList(); }
      },
      setPlaceholder: function (t) { input.placeholder = t; },
      setScope: function (fn) { scope = fn || null; },
      focusOpen: function () { input.focus(); openList(''); },
      count: function () { return options.length; }
    };
  }

  function statusClass(status) {
    var i = STATUSES.indexOf(status);
    return i < 0 ? '' : 's' + i;
  }

  function rStatusClass(status) {
    var i = R_STATUSES.indexOf(status);
    return i < 0 ? '' : 'r' + i;
  }

  /* ---------- สลับระหว่างงานแบตกับงานซ่อมรถ ---------- */

  var repairLoaded = false;

  $('tabBattery').addEventListener('click', function () { showTab('battery'); });
  $('tabRepair').addEventListener('click', function () { showTab('repair'); });

  function showTab(name) {
    var repair = name === 'repair';
    $('tabBattery').classList.toggle('active', !repair);
    $('tabRepair').classList.toggle('active', repair);
    $('viewBattery').classList.toggle('hidden', repair);
    $('viewRepair').classList.toggle('hidden', !repair);
    $('appTitle').textContent = repair ? '🔧 สถานะรถส่งซ่อม' : '🔋 สถานะการกระตุ้นแบตเตอรี่';
    window.scrollTo({ top: 0 });

    if (repair && !repairLoaded) {
      repairLoaded = true;
      rSearch();
    }
  }

  function initCombos() {
    var hint = 'พิมพ์รหัสสาขาหรือชื่อสาขา';
    cbBranch = makeCombo('fBranch', { placeholder: hint });
    cbRBranch = makeCombo('rfBranch', { placeholder: hint });
    cbBranchFilter = makeCombo('branchFilter', { placeholder: 'ทุกสาขา' });
    cbRBranchFilter = makeCombo('rBranchFilter', { placeholder: 'ทุกสาขา' });
  }

  function boot() {
    initCombos();
    applyAdminMode();
    call('apiBatteryBootstrap').then(function (res) {
      if (!res || !res.ok) throw new Error((res && res.error) || 'โหลดข้อมูลไม่สำเร็จ');

      STATUSES = res.statuses;
      R_STATUSES = res.repairStatuses || [];
      APP_URL = res.appUrl || '';
      if (res.deliveredStatus) DELIVERED_STATUS = res.deliveredStatus;

      // ตัวเลือกสาขา: พิมพ์ได้ทั้งรหัสและชื่อ เพราะจับคู่กับข้อความทั้งบรรทัด
      var branchOptions = res.branches.map(function (b) {
        return typeof b === 'string'
          ? { value: b, label: b }
          : { value: b.name, label: b.name, sub: b.code + (b.zone ? ' • เขต' + b.zone : '') };
      });
      BRANCH_OPTIONS = branchOptions;
      cbBranch.setOptions(branchOptions);
      cbRBranch.setOptions(branchOptions);
      // ช่องกรอง: ค่าว่าง = ทุกสาขา
      var filterOptions = [{ value: '', label: '— ทุกสาขา —' }].concat(branchOptions);
      cbBranchFilter.setOptions(filterOptions);
      cbRBranchFilter.setOptions(filterOptions);
      STATUSES.forEach(function (s) {
        $('statusFilter').appendChild(new Option(s, s));
        $('fStatus').appendChild(new Option(s, s));
      });
      R_STATUSES.forEach(function (s) {
        $('rStatusFilter').appendChild(new Option(s, s));
        $('rfStatus').appendChild(new Option(s, s));
      });
      $('fDate').value = res.today;
      $('rfDate').value = res.today;

      // ลิงก์ที่เจาะจงสาขา ให้ล็อกตัวกรองไว้เลย
      if (LOCK_BRANCH) {
        // ตั้งค่าแล้วปิดช่องเอง ไม่ใช้ setEnabled(false) เพราะมันจะล้างค่าที่เพิ่งตั้งทิ้ง
        [cbBranchFilter, cbRBranchFilter].forEach(function (cb) {
          cb.setValue(LOCK_BRANCH);
          cb.input.disabled = true;
          cb.el.classList.add('disabled');
        });
      }

      applyAdminMode();
      $('loading').classList.add('hidden');
      search();

      // ลิงก์ไม่มี key แต่เคยกรอกกุญแจไว้ในเครื่องนี้ ก็เข้าโหมดแอดมินให้เลย
      if (!IS_ADMIN) {
        var saved = localStorage.getItem('bt_key') || '';
        if (saved) tryAdminKey(saved, true);
      }
    }).catch(function (err) {
      $('loading').classList.add('hidden');
      $('fatal').classList.remove('hidden');
      $('fatalMsg').textContent = 'โหลดข้อมูลไม่สำเร็จ: ' + (err.message || err);
    });
  }

  /* ---------- เข้า/ออกโหมดแอดมิน ---------- */

  /**
   * โชว์หรือซ่อนของที่เฉพาะแอดมินใช้
   * นี่เป็นแค่เรื่องหน้าตา — ด่านจริงอยู่ที่เซิร์ฟเวอร์ซึ่งตรวจกุญแจทุกครั้งที่เขียนข้อมูล
   */
  function applyAdminMode() {
    $('modeLabel').textContent = IS_ADMIN
      ? 'โหมดแอดมิน — อัปเดตสถานะได้'
      : 'ดูสถานะอย่างเดียว';
    if (LOCK_BRANCH) {
      $('modeLabel').textContent += ' • เฉพาะสาขา ' + LOCK_BRANCH;
    } else if (CFG.lockBranchInvalid) {
      $('modeLabel').textContent += ' • ไม่พบสาขา "' + CFG.wantBranch + '" จึงแสดงทุกสาขา';
    }

    $('newBtn').classList.toggle('hidden', !IS_ADMIN);
    $('rNewBtn').classList.toggle('hidden', !IS_ADMIN);

    $('adminToggle').textContent = IS_ADMIN ? '🔓' : '🔑';
    $('adminToggle').title = IS_ADMIN ? 'ออกจากโหมดแอดมิน' : 'เข้าโหมดแอดมิน';
    $('adminToggle').classList.toggle('on', IS_ADMIN);
    $('adminKeyWrap').classList.add('hidden');
  }

  $('adminToggle').addEventListener('click', function () {
    if (IS_ADMIN) {
      IS_ADMIN = false;
      ADMIN_KEY = '';
      localStorage.removeItem('bt_key');
      applyAdminMode();
      refreshBothTabs();
      return;
    }
    $('adminKeyWrap').classList.toggle('hidden');
    if (!$('adminKeyWrap').classList.contains('hidden')) $('adminKeyInput').focus();
  });

  $('adminKeyBtn').addEventListener('click', function () { tryAdminKey($('adminKeyInput').value.trim()); });
  $('adminKeyInput').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') tryAdminKey(this.value.trim());
  });

  function tryAdminKey(key, quiet) {
    if (!key) return adminKeyError('ยังไม่ได้กรอกกุญแจ');
    $('adminKeyBtn').disabled = true;

    call('apiCheckAdminKey', key).then(function (res) {
      $('adminKeyBtn').disabled = false;
      if (!res || !res.ok || !res.isAdmin) {
        localStorage.removeItem('bt_key');   // กุญแจที่เก็บไว้ใช้ไม่ได้แล้ว ลบทิ้ง
        if (!quiet) adminKeyError('กุญแจไม่ถูกต้อง');
        return;
      }
      IS_ADMIN = true;
      ADMIN_KEY = key;
      localStorage.setItem('bt_key', key);
      $('adminKeyInput').value = '';
      $('adminKeyMsg').classList.add('hidden');
      applyAdminMode();
      refreshBothTabs();
    }).catch(function (err) {
      $('adminKeyBtn').disabled = false;
      if (!quiet) adminKeyError('ตรวจกุญแจไม่สำเร็จ: ' + (err.message || err));
    });
  }

  function adminKeyError(msg) {
    $('adminKeyMsg').textContent = msg;
    $('adminKeyMsg').classList.remove('hidden');
  }

  /** วาดรายการใหม่ทั้งสองแท็บ ให้ปุ่มในการ์ดตรงกับสิทธิ์ปัจจุบัน */
  function refreshBothTabs() {
    search();
    if (repairLoaded) rSearch();
  }

  // ห่อไว้ ไม่งั้น event object จะกลายเป็น doneMsg ไปโผล่บนหน้าจอ
  $('searchBtn').addEventListener('click', function () { search(); });
  $('q').addEventListener('keydown', function (e) { if (e.key === 'Enter') search(); });
  $('newBtn').addEventListener('click', function () { openForm(null); });
  $('cancelBtn').addEventListener('click', closeForm);
  $('saveBtn').addEventListener('click', save);
  $('addItemBtn').addEventListener('click', function () {
    collectItems();
    items.push(blankItem());
    renderItems();
    var rows = $('itemRows').querySelectorAll('.item input');
    if (rows.length) rows[rows.length - 4].focus();
  });

  function setStatus(msg, isError) {
    var box = $('status');
    box.classList.remove('hidden');
    box.innerHTML = '';
    var div = document.createElement('div');
    div.className = isError ? 'banner err' : 'muted';
    div.textContent = msg;
    box.appendChild(div);
  }

  /** doneMsg = ข้อความที่อยากให้ค้างไว้หลังโหลดเสร็จ เช่น "บันทึกแล้ว" */
  function search(doneMsg) {
    // ล้างรายการตอน "ได้ผลลัพธ์" ไม่ใช่ตอนยิงคำขอ
    // ถ้าล้างตอนยิง แล้วมีสองคำขอซ้อนกัน (เช่นกดเปลี่ยนสถานะรัว ๆ) ผลของอันแรก
    // จะมาต่อท้ายหลังอันที่สองล้างไปแล้ว การ์ดเลยขึ้นซ้ำสองชุด
    var seq = ++searchSeq;
    setStatus('กำลังโหลด…');
    call('apiListBatteries', {
      q: $('q').value.trim(),
      branch: LOCK_BRANCH || cbBranchFilter.getValue(),
      status: $('statusFilter').value
    }).then(function (res) {
      if (seq !== searchSeq) return;   // มีการค้นหาใหม่แซงไปแล้ว ทิ้งผลเก่า
      $('results').innerHTML = '';
      if (!res || !res.ok) return setStatus((res && res.error) || 'โหลดไม่สำเร็จ', true);
      renderSummary(res.counts);
      render(res.results, res.total);
      if (doneMsg) setStatus(doneMsg);
    }).catch(function (err) {
      if (seq !== searchSeq) return;
      setStatus('โหลดไม่สำเร็จ: ' + (err.message || err), true);
    });
  }

  function renderSummary(counts) {
    var box = $('summary');
    box.innerHTML = '';
    STATUSES.forEach(function (s, i) {
      var el = document.createElement('div');
      el.className = 'box s' + i;
      var n = document.createElement('div');
      n.className = 'n';
      n.textContent = counts[s] || 0;
      var t = document.createElement('div');
      t.className = 't';
      t.textContent = s;
      el.appendChild(n);
      el.appendChild(t);
      box.appendChild(el);
    });
  }

  function render(rows, total) {
    if (!rows.length) {
      // แยกให้ชัดว่า "ยังไม่มีข้อมูลเลย" กับ "มีข้อมูลแต่ตัวกรองไม่ตรง" คนละเรื่องกัน
      return setStatus(total
        ? 'ในระบบมี ' + total + ' รายการ แต่ไม่มีรายการไหนตรงกับตัวกรองที่เลือกไว้'
        : 'ยังไม่มีรายการแบตในระบบ');
    }
    setStatus('พบ ' + rows.length + ' รายการ (ล่าสุดขึ้นก่อน)');

    var box = $('results');
    rows.forEach(function (b) {
      var el = document.createElement('div');
      el.className = 'bat ' + statusClass(b.status);

      var head = document.createElement('div');
      head.className = 'head';
      var left = document.createElement('span');
      left.textContent = b.batteryId;
      var right = document.createElement('span');
      right.textContent = b.receivedDate ? 'รับเข้า ' + thaiDate(b.receivedDate) : '';
      head.appendChild(left);
      head.appendChild(right);
      el.appendChild(head);

      var branch = document.createElement('div');
      branch.className = 'branch';
      branch.textContent = b.branch + (b.zone ? ' (เขต' + b.zone + ')' : '');
      el.appendChild(branch);

      var badge = document.createElement('div');
      badge.className = 'badge';
      badge.textContent = b.status || 'ยังไม่ระบุสถานะ';
      el.appendChild(badge);

      var bits = [];
      if (b.qty) bits.push(b.qty + ' ลูก');
      if (b.alNo) bits.push('อล. ' + b.alNo);
      if (b.model) bits.push(b.model);
      if (b.serial) bits.push('ซีเรียล ' + b.serial);
      if (bits.length) {
        var meta = document.createElement('div');
        meta.className = 'meta';
        meta.textContent = bits.join('  •  ');
        el.appendChild(meta);
      }

      if (b.note) {
        var note = document.createElement('div');
        note.className = 'meta';
        note.textContent = '📝 ' + b.note;
        el.appendChild(note);
      }

      var upd = document.createElement('div');
      upd.className = 'meta';
      upd.style.marginTop = '6px';
      upd.classList.toggle('hidden', !b.updatedAt);
      upd.textContent = b.updatedAt
        ? 'อัปเดตล่าสุด ' + b.updatedAt + (b.updatedBy ? ' โดย ' + b.updatedBy : '')
        : '';
      el.appendChild(upd);

      // ใบบันทึกการจัดส่ง — ทุกคนเห็น รวมถึงสาขา แต่แก้ไม่ได้
      if (b.deliveredAt || b.receiver || b.deliveryPhotoId) el.appendChild(deliveryBlock(b));

      // ปุ่มแก้ไขและช่องเปลี่ยนสถานะ มีเฉพาะโหมดแอดมิน
      if (IS_ADMIN) {
        var sel = document.createElement('select');
        STATUSES.forEach(function (s) { sel.appendChild(new Option(s, s)); });
        sel.value = b.status;
        sel.addEventListener('change', function () {
          // ขั้น "จัดส่งแล้ว" ต้องมีใบจัดส่งกำกับ พาไปกรอกใบก่อน ไม่เปลี่ยนสถานะลอย ๆ
          if (sel.value === DELIVERED_STATUS) {
            sel.value = b.status;
            return openDelivery(b);
          }
          // จำสถานะเดิมไว้ตั้งแต่ก่อนยิงคำสั่ง อย่าไปอ่านทีหลัง
          // ค่าใน b อาจถูกอะไรเปลี่ยนไปแล้วระหว่างรอผล แล้วจะคำนวณแถบสรุปผิด
          var prev = b.status;
          var next = sel.value;
          var by = localStorage.getItem('bt_by') || '';
          sel.disabled = true;
          call('apiUpdateBatteryStatus', {
            key: ADMIN_KEY, batteryId: b.batteryId, status: next, updatedBy: by
          }).then(function (res) {
            sel.disabled = false;
            if (!res || !res.ok) {
              sel.value = prev;   // ไม่ผ่าน ต้องดีดกลับ ไม่งั้นช่องโชว์ค่าที่ยังไม่ได้บันทึก
              return setStatus((res && res.error) || 'อัปเดตไม่สำเร็จ', true);
            }
            // อัปเดตเฉพาะการ์ดนี้ ไม่โหลดรายการใหม่ทั้งชุด
            bumpSummary('summary', STATUSES, prev, next);
            b.status = next;
            el.className = 'bat ' + statusClass(next);
            badge.textContent = next;
            upd.textContent = 'อัปเดตล่าสุด เมื่อสักครู่' + (by ? ' โดย ' + by : '');
            upd.classList.remove('hidden');
            setStatus('อัปเดต ' + b.batteryId + ' เป็น "' + next + '" แล้ว');
          }).catch(function (err) {
            sel.disabled = false;
            sel.value = prev;
            setStatus('อัปเดตไม่สำเร็จ: ' + (err.message || err), true);
          });
        });
        el.appendChild(sel);

        var dlv = document.createElement('button');
        dlv.type = 'button';
        dlv.className = 'ghost';
        dlv.textContent = b.deliveredAt ? '📦 แก้ใบจัดส่ง' : '📦 บันทึกการจัดส่ง';
        dlv.addEventListener('click', function () { openDelivery(b); });
        el.appendChild(dlv);

        // แก้ไข/ลบ ทำในการ์ดนี้เลย
        var fBranch, fDate, fAl, fSerial, fModel, fQty, fNote;
        var ed = cardEditor({
          label: b.batteryId,
          saveApi: 'apiSaveBattery',
          deleteApi: 'apiDeleteBattery',
          deletePayload: function () { return { key: ADMIN_KEY, batteryId: b.batteryId }; },
          build: function (panel) {
            fBranch = branchFieldInCard('สาขาเจ้าของแบต', b.branch);
            fDate = editField('วันที่รับเข้า', b.receivedDate, { type: 'date' });
            fAl = editField('อล.', b.alNo);
            fSerial = editField('ซีเรียล/รหัสแบต', b.serial);
            fModel = editField('รุ่น/ขนาด', b.model);
            fQty = editField('จำนวน (ลูก)', b.qty || 1, { type: 'number' });
            fNote = editField('หมายเหตุ', b.note);
            panel.appendChild(fBranch);
            panel.appendChild(fieldRow(fDate, fAl));
            panel.appendChild(fieldRow(fSerial, fModel));
            panel.appendChild(fieldRow(fQty, fNote));
            fBranch._mount();
          },
          collect: function () {
            var branch = fBranch._combo.getValue();
            if (!branch) return 'ยังไม่ได้เลือกสาขา';
            if (!(Number(fQty._input.value) > 0)) return 'จำนวนต้องมากกว่า 0';
            return {
              key: ADMIN_KEY, batteryId: b.batteryId, branch: branch,
              receivedDate: fDate._input.value, alNo: fAl._input.value.trim(),
              serial: fSerial._input.value.trim(), model: fModel._input.value.trim(),
              qty: fQty._input.value, note: fNote._input.value.trim(),
              status: b.status, updatedBy: localStorage.getItem('bt_by') || ''
            };
          },
          onSaved: function () { search('แก้ไข ' + b.batteryId + ' แล้ว'); },
          onDeleted: function () { search('ลบ ' + b.batteryId + ' แล้ว'); },
          onError: function (m) { setStatus(m, true); }
        });
        el.appendChild(ed.actions);
        el.appendChild(ed.panel);
      }

      box.appendChild(el);
    });
  }

  function blankItem() { return { serial: '', model: '', qty: '1', note: '' }; }

  /* ----- รายการแบตหลายก้อนในฟอร์มเดียว ----- */

  function renderItems() {
    var box = $('itemRows');
    box.innerHTML = '';
    items.forEach(function (it, idx) {
      var el = document.createElement('div');
      el.className = 'item';

      var head = document.createElement('div');
      head.className = 'no';
      var label = document.createElement('span');
      label.textContent = editingId ? 'รายละเอียด' : 'ก้อนที่ ' + (idx + 1);
      head.appendChild(label);
      if (!editingId && items.length > 1) {
        var del = document.createElement('button');
        del.type = 'button';
        del.className = 'del';
        del.textContent = 'ลบก้อนนี้';
        del.addEventListener('click', function () {
          collectItems();
          items.splice(idx, 1);
          renderItems();
        });
        head.appendChild(del);
      }
      el.appendChild(head);

      var row = document.createElement('div');
      row.className = 'row';
      row.appendChild(field('ซีเรียล/รหัสแบต', 'text', it.serial, 'serial', idx, ''));
      row.appendChild(field('รุ่น/ขนาด', 'text', it.model, 'model', idx, 'เช่น 12V 25-27Ah'));
      el.appendChild(row);

      var row2 = document.createElement('div');
      row2.className = 'row';
      row2.appendChild(field('จำนวน (ลูก)', 'number', it.qty, 'qty', idx, ''));
      row2.appendChild(field('หมายเหตุ', 'text', it.note, 'note', idx, ''));
      el.appendChild(row2);

      box.appendChild(el);
    });
    $('addItemBtn').classList.toggle('hidden', !!editingId);
    $('itemsLabel').textContent = editingId
      ? 'รายละเอียดแบต'
      : 'รายการแบต (' + items.length + ' ก้อน)';
  }

  function field(labelText, type, value, name, idx, placeholder) {
    var wrap = document.createElement('div');
    var lab = document.createElement('label');
    lab.textContent = labelText;
    var inp = document.createElement('input');
    inp.type = type;
    inp.value = value == null ? '' : value;
    inp.setAttribute('data-name', name);
    inp.setAttribute('data-idx', String(idx));
    inp.autocomplete = 'off';
    if (placeholder) inp.placeholder = placeholder;
    if (type === 'number') { inp.min = '1'; inp.step = '1'; }
    wrap.appendChild(lab);
    wrap.appendChild(inp);
    return wrap;
  }

  /** ดึงค่าที่พิมพ์ไว้กลับเข้า items ก่อนวาดใหม่ ไม่งั้นของที่พิมพ์ค้างจะหาย */
  function collectItems() {
    var inputs = $('itemRows').querySelectorAll('input[data-name]');
    for (var i = 0; i < inputs.length; i++) {
      var idx = Number(inputs[i].getAttribute('data-idx'));
      if (items[idx]) items[idx][inputs[i].getAttribute('data-name')] = inputs[i].value;
    }
  }

  /** ขยับตัวเลขในแถบสรุปเอง หลังเปลี่ยนสถานะการ์ดเดียว จะได้ไม่ต้องโหลดรายการใหม่ทั้งชุด */
  function bumpSummary(boxId, statuses, from, to) {
    var boxes = $(boxId).children;
    function nudge(status, delta) {
      var i = statuses.indexOf(status);
      if (i < 0 || !boxes[i]) return;
      var n = boxes[i].querySelector('.n');
      n.textContent = Math.max(0, (Number(n.textContent) || 0) + delta);
    }
    nudge(from, -1);
    nudge(to, 1);
  }

  /* ---------- แก้ไข / ลบ ภายในการ์ด ----------
   *
   * ทำในการ์ดเลย ไม่เด้งไปฟอร์มบนสุดของหน้า จะได้ไม่หลุดจากรายการที่กำลังดูอยู่
   * ฟอร์มบนสุดเหลือหน้าที่เดียวคือ "เพิ่มรายการใหม่"
   */

  /** ช่องกรอกหนึ่งช่องพร้อมป้ายกำกับ ใช้ประกอบแผงแก้ไขในการ์ด */
  function editField(labelText, value, opts) {
    opts = opts || {};
    var wrap = document.createElement('div');
    var lab = document.createElement('label');
    lab.textContent = labelText;
    var inp = document.createElement('input');
    inp.type = opts.type || 'text';
    inp.value = value == null ? '' : value;
    inp.autocomplete = 'off';
    if (opts.placeholder) inp.placeholder = opts.placeholder;
    if (opts.type === 'number') { inp.min = '1'; inp.step = '1'; }
    wrap.appendChild(lab);
    wrap.appendChild(inp);
    wrap._input = inp;
    return wrap;
  }

  function fieldRow(a, b) {
    var row = document.createElement('div');
    row.className = 'row';
    row.appendChild(a);
    row.appendChild(b);
    return row;
  }

  /** ช่องเลือกสาขาในการ์ด — พิมพ์รหัสสาขาได้เหมือนช่องอื่น */
  function branchFieldInCard(labelText, value) {
    var wrap = document.createElement('div');
    var lab = document.createElement('label');
    lab.textContent = labelText;
    var host = document.createElement('div');
    host.className = 'combo';
    host.id = 'cardbranch' + (++cardSeq);
    wrap.appendChild(lab);
    wrap.appendChild(host);
    wrap._mount = function () {
      var cb = makeCombo(host.id, { placeholder: 'พิมพ์รหัสสาขาหรือชื่อสาขา' });
      cb.setOptions(BRANCH_OPTIONS);
      cb.setValue(value || '');
      wrap._combo = cb;
    };
    return wrap;
  }

  /**
   * แถวปุ่มจัดการในการ์ด + แผงแก้ไขที่กางอยู่ในการ์ดเอง
   * buildFields คืนอาร์เรย์ของ element ที่จะใส่ในแผง และ collect คืน payload ตอนกดบันทึก
   */
  function cardEditor(cfg) {
    var panel = document.createElement('div');
    panel.className = 'card-edit hidden';

    var msg = document.createElement('div');
    msg.className = 'banner err hidden';

    var actions = document.createElement('div');
    actions.className = 'card-actions';

    var editBtn = document.createElement('button');
    editBtn.type = 'button';
    editBtn.className = 'ghost';
    editBtn.textContent = '✏️ แก้ไข';

    var delBtn = document.createElement('button');
    delBtn.type = 'button';
    delBtn.className = 'ghost danger';
    delBtn.textContent = '🗑️ ลบ';

    actions.appendChild(editBtn);
    actions.appendChild(delBtn);

    var mounted = false;
    editBtn.addEventListener('click', function () {
      if (!mounted) {
        cfg.build(panel);
        var save = document.createElement('button');
        save.type = 'button';
        save.className = 'primary';
        save.textContent = 'บันทึกการแก้ไข';
        var cancel = document.createElement('button');
        cancel.type = 'button';
        cancel.className = 'ghost';
        cancel.textContent = 'ยกเลิก';
        panel.appendChild(msg);
        panel.appendChild(save);
        panel.appendChild(cancel);

        cancel.addEventListener('click', function () {
          panel.classList.add('hidden');
          editBtn.textContent = '✏️ แก้ไข';
        });
        save.addEventListener('click', function () {
          var payload = cfg.collect();
          if (typeof payload === 'string') {   // คืนเป็นข้อความ = ข้อความแจ้งเตือน
            msg.textContent = payload;
            msg.classList.remove('hidden');
            return;
          }
          msg.classList.add('hidden');
          save.disabled = true;
          save.textContent = 'กำลังบันทึก…';
          call(cfg.saveApi, payload).then(function (res) {
            save.disabled = false;
            save.textContent = 'บันทึกการแก้ไข';
            if (!res || !res.ok) {
              msg.textContent = (res && res.error) || 'บันทึกไม่สำเร็จ';
              msg.classList.remove('hidden');
              return;
            }
            cfg.onSaved();
          }).catch(function (err) {
            save.disabled = false;
            save.textContent = 'บันทึกการแก้ไข';
            msg.textContent = 'บันทึกไม่สำเร็จ: ' + (err.message || err);
            msg.classList.remove('hidden');
          });
        });
        mounted = true;
      }
      var open = panel.classList.toggle('hidden');
      editBtn.textContent = open ? '✏️ แก้ไข' : '✕ ปิดการแก้ไข';
    });

    delBtn.addEventListener('click', function () {
      if (!window.confirm('ลบ ' + cfg.label + ' ทิ้งเลยไหม? ลบแล้วเอากลับไม่ได้')) return;
      delBtn.disabled = true;
      delBtn.textContent = 'กำลังลบ…';
      call(cfg.deleteApi, cfg.deletePayload()).then(function (res) {
        delBtn.disabled = false;
        delBtn.textContent = '🗑️ ลบ';
        if (!res || !res.ok) return cfg.onError((res && res.error) || 'ลบไม่สำเร็จ');
        cfg.onDeleted();
      }).catch(function (err) {
        delBtn.disabled = false;
        delBtn.textContent = '🗑️ ลบ';
        cfg.onError('ลบไม่สำเร็จ: ' + (err.message || err));
      });
    });

    return { actions: actions, panel: panel };
  }

  /** กล่องสรุปใบจัดส่งบนการ์ด — อ่านอย่างเดียว ใครเปิดหน้านี้ก็เห็น */
  function deliveryBlock(b) {
    var box = document.createElement('div');
    box.className = 'dlv-box';

    var head = document.createElement('div');
    head.className = 'dlv-head';
    head.textContent = '📦 ใบบันทึกการจัดส่ง';
    box.appendChild(head);

    if (b.receiver) box.appendChild(dlvLine('ผู้มารับ', b.receiver));
    if (b.deliveredAt) box.appendChild(dlvLine('วันเวลาที่จัดส่ง', b.deliveredAt));
    if (b.deliveryNote) box.appendChild(dlvLine('รายละเอียด', b.deliveryNote));

    if (b.deliveryPhotoId && APP_URL) {
      var p = document.createElement('div');
      p.className = 'meta';
      p.style.marginTop = '6px';
      var link = document.createElement('a');
      link.href = APP_URL + '?img=' + encodeURIComponent(b.deliveryPhotoId);
      link.target = '_blank';
      link.rel = 'noopener';
      link.style.color = 'var(--primary)';
      link.textContent = '📎 ดูรูปหลักฐานการจัดส่ง';
      p.appendChild(link);
      box.appendChild(p);
    } else if (b.deliveryPhotoId) {
      box.appendChild(dlvLine('รูปหลักฐาน', 'มีรูปเก็บไว้แล้ว (เปิดดูได้จากลิงก์เว็บแอป)'));
    }
    return box;
  }

  function dlvLine(label, value) {
    var d = document.createElement('div');
    d.className = 'meta';
    d.textContent = label + ': ' + value;
    return d;
  }

  function openForm(b) {
    editingId = b ? b.batteryId : '';
    $('formTitle').textContent = b ? 'แก้ไข ' + b.batteryId : 'เพิ่มรายการแบตเตอรี่';
    cbBranch.setValue(b ? b.branch : (LOCK_BRANCH || ''));
    $('fDate').value = b ? b.receivedDate : $('fDate').value;
    $('fAl').value = b ? (b.alNo || '') : '';
    $('fStatus').value = b ? b.status : STATUSES[0];
    $('fBy').value = localStorage.getItem('bt_by') || '';

    items = b
      ? [{ serial: b.serial, model: b.model, qty: b.qty || '1', note: b.note }]
      : [blankItem()];
    renderItems();

    $('formMsg').classList.add('hidden');
    $('formCard').classList.remove('hidden');
    $('dlvCard').classList.add('hidden');
    $('filterCard').classList.add('hidden');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function closeForm() {
    $('formCard').classList.add('hidden');
    $('filterCard').classList.remove('hidden');
    editingId = '';
    items = [];
  }

  function formError(msg) {
    $('formMsg').textContent = msg;
    $('formMsg').classList.remove('hidden');
  }

  function save() {
    collectItems();

    var payload = {
      key: ADMIN_KEY,
      branch: cbBranch.getValue(),
      receivedDate: $('fDate').value,
      alNo: $('fAl').value.trim(),
      status: $('fStatus').value,
      updatedBy: $('fBy').value.trim(),
      items: items.map(function (it) {
        return {
          serial: String(it.serial || '').trim(),
          model: String(it.model || '').trim(),
          qty: String(it.qty || '').trim() || '1',
          note: String(it.note || '').trim()
        };
      })
    };
    if (editingId) payload.items[0].batteryId = editingId;

    if (!payload.branch) return formError('ยังไม่ได้เลือกสาขา');
    for (var i = 0; i < payload.items.length; i++) {
      if (!(Number(payload.items[i].qty) > 0)) {
        return formError('ก้อนที่ ' + (i + 1) + ' ใส่จำนวนไม่ถูกต้อง');
      }
    }
    localStorage.setItem('bt_by', payload.updatedBy);

    $('saveBtn').disabled = true;
    $('saveBtn').textContent = 'กำลังบันทึก…';

    call('apiSaveBatteries', payload).then(function (res) {
      $('saveBtn').disabled = false;
      $('saveBtn').textContent = 'บันทึก';
      if (!res || !res.ok) return formError((res && res.error) || 'บันทึกไม่สำเร็จ');
      var msg = editingId ? 'บันทึกการแก้ไขแล้ว' : 'บันทึกแบต ' + (res.count || 0) + ' รายการแล้ว';
      closeForm();
      search(msg);
    }).catch(function (err) {
      $('saveBtn').disabled = false;
      $('saveBtn').textContent = 'บันทึก';
      formError('บันทึกไม่สำเร็จ: ' + (err.message || err));
    });
  }

  /* =====================================================================
   * ใบบันทึกการจัดส่ง — ถ่าย/เลือกรูป ใส่รายละเอียด ใส่ชื่อคนที่มารับ
   * บันทึกแล้วเด้งกลับไปที่รายงาน ซึ่งสาขาเปิดดูได้แต่แก้ไม่ได้
   * =================================================================== */

  $('dlvCameraBtn').addEventListener('click', function () { $('dlvCamera').click(); });
  $('dlvPickBtn').addEventListener('click', function () { $('dlvFile').click(); });
  $('dlvCamera').addEventListener('change', function () { pickDeliveryPhoto(this.files[0]); });
  $('dlvFile').addEventListener('change', function () { pickDeliveryPhoto(this.files[0]); });
  $('dlvCancelBtn').addEventListener('click', closeDelivery);
  $('dlvSaveBtn').addEventListener('click', saveDelivery);

  function openDelivery(b) {
    if (!IS_ADMIN) return;   // ปุ่มนี้ไม่โผล่ให้สาขาอยู่แล้ว กันไว้อีกชั้น
    dlvBattery = b;
    dlvImage = null;

    $('dlvTitle').textContent = b.deliveredAt ? 'แก้ใบบันทึกการจัดส่ง' : 'บันทึกการจัดส่ง';
    $('dlvFor').textContent = b.batteryId + ' • ' + b.branch +
      (b.serial ? ' • ซีเรียล ' + b.serial : '') + (b.qty ? ' • ' + b.qty + ' ลูก' : '');
    $('dlvReceiver').value = b.receiver || '';
    $('dlvNote').value = b.deliveryNote || '';
    $('dlvBy').value = localStorage.getItem('bt_by') || '';
    $('dlvPreview').classList.add('hidden');
    $('dlvMsg').classList.add('hidden');
    $('dlvCamera').value = '';
    $('dlvFile').value = '';

    // มีรูปเดิมอยู่แล้ว บอกไว้ว่าถ้าไม่แนบใหม่ รูปเดิมยังอยู่
    if (b.deliveryPhotoId) {
      $('dlvOldPhoto').textContent = '📎 มีรูปหลักฐานเดิมอยู่แล้ว — ไม่แนบรูปใหม่ ระบบจะเก็บรูปเดิมไว้ตามเดิม';
      $('dlvOldPhoto').classList.remove('hidden');
    } else {
      $('dlvOldPhoto').classList.add('hidden');
    }

    $('dlvCard').classList.remove('hidden');
    $('formCard').classList.add('hidden');
    $('filterCard').classList.add('hidden');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function closeDelivery() {
    $('dlvCard').classList.add('hidden');
    $('filterCard').classList.remove('hidden');
    dlvBattery = null;
    dlvImage = null;
  }

  function dlvError(msg) {
    $('dlvMsg').textContent = msg;
    $('dlvMsg').classList.remove('hidden');
  }

  /** ย่อรูปก่อนส่ง ด้านยาวสุดเหลือ 1600px ยังเห็นรายละเอียดในรูปได้สบาย */
  function pickDeliveryPhoto(file) {
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      var img = new Image();
      img.onload = function () {
        var max = 1600;
        var scale = Math.min(1, max / Math.max(img.width, img.height));
        var canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        var dataUrl = canvas.toDataURL('image/jpeg', 0.85);
        dlvImage = { dataUrl: dataUrl, base64: dataUrl.split(',')[1], mimeType: 'image/jpeg' };
        $('dlvPreview').src = dataUrl;
        $('dlvPreview').classList.remove('hidden');
        $('dlvMsg').classList.add('hidden');
      };
      img.onerror = function () { dlvError('เปิดไฟล์รูปไม่ได้ ลองเลือกรูปใหม่'); };
      img.src = reader.result;
    };
    reader.onerror = function () { dlvError('อ่านไฟล์รูปไม่ได้ ลองเลือกรูปใหม่'); };
    reader.readAsDataURL(file);
  }

  function saveDelivery() {
    if (!dlvBattery) return;
    var receiver = $('dlvReceiver').value.trim();
    if (!receiver) return dlvError('ยังไม่ได้ใส่ชื่อคนที่มารับ');
    if (!dlvImage && !dlvBattery.deliveryPhotoId) {
      return dlvError('ยังไม่ได้แนบรูปหลักฐานการจัดส่ง');
    }

    var by = $('dlvBy').value.trim();
    localStorage.setItem('bt_by', by);

    $('dlvSaveBtn').disabled = true;
    $('dlvSaveBtn').textContent = 'กำลังบันทึก…';

    call('apiSaveDelivery', {
      key: ADMIN_KEY,
      batteryId: dlvBattery.batteryId,
      receiver: receiver,
      deliveryNote: $('dlvNote').value.trim(),
      updatedBy: by,
      base64: dlvImage ? dlvImage.base64 : '',
      mimeType: dlvImage ? dlvImage.mimeType : ''
    }).then(function (res) {
      $('dlvSaveBtn').disabled = false;
      $('dlvSaveBtn').textContent = 'บันทึกการจัดส่ง';
      if (!res || !res.ok) return dlvError((res && res.error) || 'บันทึกไม่สำเร็จ');

      var id = dlvBattery.batteryId;
      closeDelivery();
      // เด้งกลับไปที่รายงาน พร้อมบอกว่ารายการไหนเพิ่งบันทึกไป
      search('บันทึกการจัดส่ง ' + id + ' แล้ว — สาขาเปิดดูรายละเอียดและรูปหลักฐานได้');
    }).catch(function (err) {
      $('dlvSaveBtn').disabled = false;
      $('dlvSaveBtn').textContent = 'บันทึกการจัดส่ง';
      dlvError('บันทึกไม่สำเร็จ: ' + (err.message || err));
    });
  }

  function thaiDate(iso) {
    var m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
    return m ? m[3] + '/' + m[2] + '/' + m[1] : iso;
  }

  /* =====================================================================
   * งานรถส่งซ่อม — โครงเดียวกับงานแบต ต่างที่ตัวระบุงานคือเลข JOB
   * =================================================================== */

  $('rSearchBtn').addEventListener('click', function () { rSearch(); });
  $('rq').addEventListener('keydown', function (e) { if (e.key === 'Enter') rSearch(); });
  $('rNewBtn').addEventListener('click', function () { rOpenForm(null); });
  $('rCancelBtn').addEventListener('click', rCloseForm);
  $('rSaveBtn').addEventListener('click', rSave);

  function rSetStatus(msg, isError) {
    var box = $('rStatus');
    box.classList.remove('hidden');
    box.innerHTML = '';
    var div = document.createElement('div');
    div.className = isError ? 'banner err' : 'muted';
    div.textContent = msg;
    box.appendChild(div);
  }

  function rSearch(doneMsg) {
    var seq = ++rSearchSeq;   // เหตุผลเดียวกับฝั่งแบต — กันการ์ดขึ้นซ้ำ
    rSetStatus('กำลังโหลด…');
    call('apiListRepairs', {
      q: $('rq').value.trim(),
      branch: LOCK_BRANCH || cbRBranchFilter.getValue(),
      status: $('rStatusFilter').value
    }).then(function (res) {
      if (seq !== rSearchSeq) return;
      $('rResults').innerHTML = '';
      if (!res || !res.ok) return rSetStatus((res && res.error) || 'โหลดไม่สำเร็จ', true);
      rRenderSummary(res.counts);
      rRender(res.results, res.total);
      if (doneMsg) rSetStatus(doneMsg);
    }).catch(function (err) {
      if (seq !== rSearchSeq) return;
      rSetStatus('โหลดไม่สำเร็จ: ' + (err.message || err), true);
    });
  }

  function rRenderSummary(counts) {
    var box = $('rSummary');
    box.innerHTML = '';
    R_STATUSES.forEach(function (s, i) {
      var el = document.createElement('div');
      el.className = 'box r' + i;
      var n = document.createElement('div');
      n.className = 'n';
      n.textContent = counts[s] || 0;
      var t = document.createElement('div');
      t.className = 't';
      t.textContent = s;
      el.appendChild(n);
      el.appendChild(t);
      box.appendChild(el);
    });
  }

  function rRender(rows, total) {
    if (!rows.length) {
      return rSetStatus(total
        ? 'ในระบบมี ' + total + ' รายการ แต่ไม่มีรายการไหนตรงกับตัวกรองที่เลือกไว้'
        : 'ยังไม่มีรายการรถส่งซ่อมในระบบ');
    }
    rSetStatus('พบ ' + rows.length + ' รายการ (ล่าสุดขึ้นก่อน)');

    var box = $('rResults');
    rows.forEach(function (r) {
      var el = document.createElement('div');
      el.className = 'bat ' + rStatusClass(r.status);

      var head = document.createElement('div');
      head.className = 'head';
      var left = document.createElement('span');
      left.textContent = r.repairId;
      var right = document.createElement('span');
      right.textContent = r.receivedDate ? 'รับเข้า ' + thaiDate(r.receivedDate) : '';
      head.appendChild(left);
      head.appendChild(right);
      el.appendChild(head);

      // สาขาอยู่หัวการ์ด ให้ดูปราดเดียวรู้ว่าเป็นของสาขาไหน (เหมือนฝั่งแบต)
      var head2 = document.createElement('div');
      head2.className = 'branch';
      head2.textContent = (r.branch || 'ยังไม่ระบุสาขา') + (r.zone ? ' (เขต' + r.zone + ')' : '');
      el.appendChild(head2);

      var badge = document.createElement('div');
      badge.className = 'badge';
      badge.textContent = r.status || 'ยังไม่ระบุสถานะ';
      el.appendChild(badge);

      var bits = [];
      // เลขที่กรอกมาขึ้นต้นด้วย JOB อยู่แล้ว ไม่ต้องเติมซ้ำให้อ่านแล้วสะดุด
      if (r.jobNo) bits.push(/^job/i.test(r.jobNo) ? r.jobNo : 'JOB ' + r.jobNo);
      if (r.contractNo) bits.push('สัญญา ' + r.contractNo);
      if (r.vehicleModel) bits.push('รุ่น ' + r.vehicleModel);
      if (bits.length) {
        var meta = document.createElement('div');
        meta.className = 'meta';
        meta.textContent = bits.join('  •  ');
        el.appendChild(meta);
      }

      if (r.note) {
        var note = document.createElement('div');
        note.className = 'meta';
        note.textContent = '📝 ' + r.note;
        el.appendChild(note);
      }

      var rUpd = document.createElement('div');
      rUpd.className = 'meta';
      rUpd.style.marginTop = '6px';
      rUpd.classList.toggle('hidden', !r.updatedAt);
      rUpd.textContent = r.updatedAt
        ? 'อัปเดตล่าสุด ' + r.updatedAt + (r.updatedBy ? ' โดย ' + r.updatedBy : '')
        : '';
      el.appendChild(rUpd);

      if (IS_ADMIN) {
        var sel = document.createElement('select');
        R_STATUSES.forEach(function (s) { sel.appendChild(new Option(s, s)); });
        sel.value = r.status;
        sel.addEventListener('change', function () {
          var prev = r.status;   // เหตุผลเดียวกับฝั่งแบต
          var next = sel.value;
          var by = localStorage.getItem('bt_by') || '';
          sel.disabled = true;
          call('apiUpdateRepairStatus', {
            key: ADMIN_KEY, repairId: r.repairId, status: next, updatedBy: by
          }).then(function (res) {
            sel.disabled = false;
            if (!res || !res.ok) {
              sel.value = prev;
              return rSetStatus((res && res.error) || 'อัปเดตไม่สำเร็จ', true);
            }
            bumpSummary('rSummary', R_STATUSES, prev, next);
            r.status = next;
            el.className = 'bat ' + rStatusClass(next);
            badge.textContent = next;
            rUpd.textContent = 'อัปเดตล่าสุด เมื่อสักครู่' + (by ? ' โดย ' + by : '');
            rUpd.classList.remove('hidden');
            rSetStatus('อัปเดต ' + r.repairId + ' เป็น "' + next + '" แล้ว');
          }).catch(function (err) {
            sel.disabled = false;
            sel.value = prev;
            rSetStatus('อัปเดตไม่สำเร็จ: ' + (err.message || err), true);
          });
        });
        el.appendChild(sel);

        // แก้ไข/ลบ ทำในการ์ดนี้เลย เหมือนฝั่งแบต
        var gJob, gContract, gVehicle, gBranch, gDate, gNote;
        var red = cardEditor({
          label: r.repairId + (r.jobNo ? ' (JOB ' + r.jobNo + ')' : ''),
          saveApi: 'apiSaveRepair',
          deleteApi: 'apiDeleteRepair',
          deletePayload: function () { return { key: ADMIN_KEY, repairId: r.repairId }; },
          build: function (panel) {
            gJob = editField('เลข JOB', r.jobNo);
            gContract = editField('เลขที่สัญญา', r.contractNo);
            gVehicle = editField('รุ่นรถ', r.vehicleModel);
            gBranch = branchFieldInCard('สาขาที่ส่งซ่อม', r.branch);
            gDate = editField('วันที่รับเข้า', r.receivedDate, { type: 'date' });
            gNote = editField('หมายเหตุ', r.note);
            panel.appendChild(fieldRow(gJob, gContract));
            panel.appendChild(gVehicle);
            panel.appendChild(gBranch);
            panel.appendChild(fieldRow(gDate, gNote));
            gBranch._mount();
          },
          collect: function () {
            var branch = gBranch._combo.getValue();
            if (!branch) return 'ยังไม่ได้เลือกสาขา';
            return {
              key: ADMIN_KEY, repairId: r.repairId,
              jobNo: gJob._input.value.trim(), contractNo: gContract._input.value.trim(),
              vehicleModel: gVehicle._input.value.trim(), branch: branch,
              receivedDate: gDate._input.value, note: gNote._input.value.trim(),
              status: r.status, updatedBy: localStorage.getItem('bt_by') || ''
            };
          },
          onSaved: function () { rSearch('แก้ไข ' + r.repairId + ' แล้ว'); },
          onDeleted: function () { rSearch('ลบ ' + r.repairId + ' แล้ว'); },
          onError: function (m) { rSetStatus(m, true); }
        });
        el.appendChild(red.actions);
        el.appendChild(red.panel);
      }

      box.appendChild(el);
    });
  }

  function rOpenForm(r) {
    rEditingId = r ? r.repairId : '';
    $('rFormTitle').textContent = r ? 'แก้ไข ' + r.repairId : 'เพิ่มรายการรถส่งซ่อม';
    $('rfJob').value = r ? r.jobNo : '';
    $('rfContract').value = r ? r.contractNo : '';
    $('rfVehicle').value = r ? r.vehicleModel : '';
    cbRBranch.setValue(r ? r.branch : (LOCK_BRANCH || ''));
    $('rfDate').value = r ? r.receivedDate : $('rfDate').value;
    $('rfStatus').value = r ? r.status : R_STATUSES[0];
    $('rfNote').value = r ? r.note : '';
    $('rfBy').value = localStorage.getItem('bt_by') || '';

    $('rFormMsg').classList.add('hidden');
    $('rFormCard').classList.remove('hidden');
    $('rFilterCard').classList.add('hidden');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function rCloseForm() {
    $('rFormCard').classList.add('hidden');
    $('rFilterCard').classList.remove('hidden');
    rEditingId = '';
  }

  function rFormError(msg) {
    $('rFormMsg').textContent = msg;
    $('rFormMsg').classList.remove('hidden');
  }

  function rSave() {
    var payload = {
      key: ADMIN_KEY,
      repairId: rEditingId,
      jobNo: $('rfJob').value.trim(),
      contractNo: $('rfContract').value.trim(),
      vehicleModel: $('rfVehicle').value.trim(),
      branch: cbRBranch.getValue(),
      receivedDate: $('rfDate').value,
      status: $('rfStatus').value,
      note: $('rfNote').value.trim(),
      updatedBy: $('rfBy').value.trim()
    };
    if (!payload.branch) return rFormError('ยังไม่ได้เลือกสาขา');
    localStorage.setItem('bt_by', payload.updatedBy);

    $('rSaveBtn').disabled = true;
    $('rSaveBtn').textContent = 'กำลังบันทึก…';

    call('apiSaveRepair', payload).then(function (res) {
      $('rSaveBtn').disabled = false;
      $('rSaveBtn').textContent = 'บันทึก';
      if (!res || !res.ok) return rFormError((res && res.error) || 'บันทึกไม่สำเร็จ');
      var msg = rEditingId ? 'บันทึกการแก้ไขแล้ว'
        : 'บันทึกรายการ' + (payload.jobNo ? ' JOB ' + payload.jobNo : 'ใหม่') + ' แล้ว';
      rCloseForm();
      rSearch(msg);
    }).catch(function (err) {
      $('rSaveBtn').disabled = false;
      $('rSaveBtn').textContent = 'บันทึก';
      rFormError('บันทึกไม่สำเร็จ: ' + (err.message || err));
    });
  }

  boot();
</script>
